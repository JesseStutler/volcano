<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#10152a"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb457"/>
      <stop offset="1" stop-color="#ff6b4a"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62e7ff"/>
      <stop offset="1" stop-color="#5284ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="glowOrange" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a50"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#62e7ff"/>
    </marker>
    <style>
      .sans { font-family: Inter, "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, monospace; }
      .muted { fill: #91a2bd; }
      .tier2 { fill: #111f39; stroke: #526c95; stroke-width: 2; }
      .tier1 { fill: #12233c; stroke: #405b80; stroke-width: 2; }
      .node { fill: #172b47; stroke: #365377; stroke-width: 1.5; }
      .tree { fill: none; stroke: #4b668a; stroke-width: 3; }
      .podText { fill: #06101e; font-weight: 800; font-size: 22px; text-anchor: middle; dominant-baseline: middle; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1690" cy="90" r="280" fill="#ff7a4d" opacity=".05"/>
  <circle cx="170" cy="1050" r="360" fill="#4d8eff" opacity=".05"/>

  <g class="sans">
    <text x="92" y="100" fill="#ff9860" font-size="26" font-weight="750" letter-spacing="4">PODGROUP × HYPERNODE</text>
    <text x="92" y="166" fill="#f5f8ff" font-size="58" font-weight="820">Group Anti-affinity</text>
    <text x="92" y="212" fill="#a8b7ce" font-size="25">P/D disaggregation · spread replicas across network failure domains</text>

    <g transform="translate(1395 72)" filter="url(#shadow)">
      <rect width="432" height="146" rx="22" fill="#111f37" stroke="#354c70" stroke-width="2"/>
      <rect x="20" y="20" width="112" height="30" rx="15" fill="#ff8a50" opacity=".16"/>
      <text x="76" y="41" fill="#ff9b61" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="1.4">PODGROUP</text>
      <text x="24" y="83" fill="#eaf0fb" font-size="20" font-weight="700">ANTI-AFFINITY @ Tier-1</text>
      <text x="24" y="116" fill="#92a5c2" font-size="17">same-role replicas → different HyperNodes</text>
    </g>

    <!-- Inference pipeline -->
    <g transform="translate(92 262)" filter="url(#shadow)">
      <rect width="1736" height="126" rx="24" fill="#0e1c32" stroke="#2d4364" stroke-width="2"/>
      <text x="38" y="40" fill="#7489a8" font-size="16" font-weight="750" letter-spacing="2">DISAGGREGATED INFERENCE</text>
      <rect x="40" y="60" width="210" height="44" rx="22" fill="#172a46"/>
      <text x="145" y="89" fill="#dce7f7" font-size="20" font-weight="650" text-anchor="middle">Prompt / 请求</text>
      <line x1="270" y1="82" x2="360" y2="82" stroke="#7186a5" stroke-width="3" marker-end="url(#arrowCyan)"/>
      <rect x="382" y="48" width="330" height="66" rx="18" fill="#102b45" stroke="#45b7df" stroke-width="2"/>
      <circle cx="425" cy="81" r="18" fill="url(#cyan)"/>
      <text x="425" y="82" class="podText" font-size="17">P</text>
      <text x="458" y="76" fill="#eff9ff" font-size="21" font-weight="750">PREFILL POOL</text>
      <text x="458" y="99" fill="#85a8c3" font-size="14">compute-bound · 弹性扩容</text>
      <line x1="733" y1="82" x2="990" y2="82" stroke="#ff8a50" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrowOrange)"/>
      <text x="862" y="64" fill="#ff9b61" font-size="14" text-anchor="middle">KV cache transfer</text>
      <rect x="1012" y="48" width="330" height="66" rx="18" fill="#302039" stroke="#e77870" stroke-width="2"/>
      <circle cx="1055" cy="81" r="18" fill="url(#orange)"/>
      <text x="1055" y="82" class="podText" font-size="17">D</text>
      <text x="1088" y="76" fill="#fff4f1" font-size="21" font-weight="750">DECODE POOL</text>
      <text x="1088" y="99" fill="#bd9ca7" font-size="14">memory-bound · 独立伸缩</text>
      <line x1="1363" y1="82" x2="1460" y2="82" stroke="#7186a5" stroke-width="3" marker-end="url(#arrowCyan)"/>
      <rect x="1482" y="60" width="210" height="44" rx="22" fill="#172a46"/>
      <text x="1587" y="89" fill="#dce7f7" font-size="20" font-weight="650" text-anchor="middle">Tokens / 输出</text>
    </g>

    <!-- Scheduler -->
    <g transform="translate(760 416)">
      <rect width="400" height="72" rx="36" fill="#162743" stroke="#5476a5" stroke-width="2"/>
      <circle cx="41" cy="36" r="18" fill="#63e6ff" opacity=".18"/>
      <path d="M32 36h18M41 27v18" stroke="#63e6ff" stroke-width="3" stroke-linecap="round"/>
      <text x="72" y="31" fill="#f2f7ff" font-size="19" font-weight="750">Volcano Scheduler</text>
      <text x="72" y="52" fill="#91a7c5" font-size="14">HyperNode-aware placement</text>
    </g>
    <path d="M960 489v43M960 532H472v45M960 532h488v45" class="tree"/>

    <!-- Tier-2 domains -->
    <g filter="url(#shadow)">
      <rect x="92" y="576" width="824" height="372" rx="28" class="tier2"/>
      <rect x="1004" y="576" width="824" height="372" rx="28" class="tier2"/>
    </g>
    <g>
      <rect x="120" y="598" width="218" height="38" rx="19" fill="#536f9d" opacity=".18"/>
      <text x="139" y="623" fill="#b8c8df" font-size="17" font-weight="750">TIER-2 · ZONE A</text>
      <rect x="1032" y="598" width="218" height="38" rx="19" fill="#536f9d" opacity=".18"/>
      <text x="1051" y="623" fill="#b8c8df" font-size="17" font-weight="750">TIER-2 · ZONE B</text>
      <text x="872" y="623" fill="#7086a5" font-size="14" text-anchor="end">failure domain</text>
      <text x="1784" y="623" fill="#7086a5" font-size="14" text-anchor="end">failure domain</text>
    </g>

    <!-- Tier-1 leaf hypernodes -->
    <g filter="url(#shadow)">
      <rect x="124" y="660" width="354" height="244" rx="22" class="tier1"/>
      <rect x="530" y="660" width="354" height="244" rx="22" class="tier1"/>
      <rect x="1036" y="660" width="354" height="244" rx="22" class="tier1"/>
      <rect x="1442" y="660" width="354" height="244" rx="22" class="tier1"/>
    </g>
    <g fill="#9eb1ca" font-size="17" font-weight="700">
      <text x="150" y="693">TIER-1 · HN-A1</text>
      <text x="556" y="693">TIER-1 · HN-A2</text>
      <text x="1062" y="693">TIER-1 · HN-B1</text>
      <text x="1468" y="693">TIER-1 · HN-B2</text>
    </g>
    <g fill="#617998" font-size="13">
      <text x="150" y="716">leaf switch / rack</text>
      <text x="556" y="716">leaf switch / rack</text>
      <text x="1062" y="716">leaf switch / rack</text>
      <text x="1468" y="716">leaf switch / rack</text>
    </g>

    <!-- Nodes -->
    <g>
      <rect x="150" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="314" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="556" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="720" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="1062" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="1226" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="1468" y="752" width="138" height="122" rx="15" class="node"/>
      <rect x="1632" y="752" width="138" height="122" rx="15" class="node"/>
    </g>
    <g class="mono" fill="#6f87a6" font-size="13">
      <text x="166" y="778">gpu-node-01</text><text x="330" y="778">gpu-node-02</text>
      <text x="572" y="778">gpu-node-03</text><text x="736" y="778">gpu-node-04</text>
      <text x="1078" y="778">gpu-node-05</text><text x="1242" y="778">gpu-node-06</text>
      <text x="1484" y="778">gpu-node-07</text><text x="1648" y="778">gpu-node-08</text>
    </g>

    <!-- Pod placements -->
    <g filter="url(#glowCyan)">
      <circle cx="219" cy="824" r="31" fill="url(#cyan)"/><text x="219" y="825" class="podText">P₀</text>
      <circle cx="1131" cy="824" r="31" fill="url(#cyan)"/><text x="1131" y="825" class="podText">P₁</text>
    </g>
    <g filter="url(#glowOrange)">
      <circle cx="625" cy="824" r="31" fill="url(#orange)"/><text x="625" y="825" class="podText">D₀</text>
      <circle cx="1537" cy="824" r="31" fill="url(#orange)"/><text x="1537" y="825" class="podText">D₁</text>
    </g>

    <!-- Anti-affinity visual relationships -->
    <path d="M251 824 C470 700 875 700 1100 824" fill="none" stroke="#62e7ff" stroke-width="3" stroke-dasharray="9 9" opacity=".8"/>
    <circle cx="676" cy="737" r="22" fill="#0c192d" stroke="#62e7ff" stroke-width="2"/>
    <path d="M666 727l20 20M686 727l-20 20" stroke="#62e7ff" stroke-width="3" stroke-linecap="round"/>
    <text x="676" y="704" fill="#79e8ff" font-size="14" font-weight="750" text-anchor="middle">P replicas separated</text>
    <path d="M656 824 C875 950 1280 950 1506 824" fill="none" stroke="#ff8a50" stroke-width="3" stroke-dasharray="9 9" opacity=".82"/>
    <circle cx="1082" cy="912" r="22" fill="#0c192d" stroke="#ff8a50" stroke-width="2"/>
    <path d="M1072 902l20 20M1092 902l-20 20" stroke="#ff8a50" stroke-width="3" stroke-linecap="round"/>
    <text x="1082" y="945" fill="#ff9f68" font-size="14" font-weight="750" text-anchor="middle">D replicas separated</text>

    <!-- Footer benefits -->
    <g transform="translate(92 982)">
      <rect width="1736" height="66" rx="20" fill="#111d32" stroke="#293e5e"/>
      <circle cx="42" cy="33" r="8" fill="#ff8a50"/>
      <text x="64" y="40" fill="#edf3fc" font-size="20" font-weight="700">独立扩缩容</text>
      <line x1="264" y1="18" x2="264" y2="48" stroke="#354b6a"/>
      <circle cx="310" cy="33" r="8" fill="#ff8a50"/>
      <text x="332" y="40" fill="#edf3fc" font-size="20" font-weight="700">热点隔离</text>
      <line x1="514" y1="18" x2="514" y2="48" stroke="#354b6a"/>
      <circle cx="560" cy="33" r="8" fill="#ff8a50"/>
      <text x="582" y="40" fill="#edf3fc" font-size="20" font-weight="700">故障域容错</text>
      <text x="1694" y="40" fill="#8095b3" font-size="16" text-anchor="end">SPREAD FOR RESILIENCE →</text>
    </g>
  </g>
</svg>

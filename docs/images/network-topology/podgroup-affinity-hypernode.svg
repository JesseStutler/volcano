  <text x="470" y="392" class="label" text-anchor="middle">W3</text><text x="470" y="414" class="tiny" text-anchor="middle">GPU</text>
  <path d="M215 397H230M280 397H360M430 397H445" fill="none" stroke="#3b7d5c" stroke-width="3"/>

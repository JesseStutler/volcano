<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .heading{font-size:21px;font-weight:700;fill:#28527d}
      .section{font-size:17px;font-weight:700;fill:#262626}
      .label{font-size:15px;font-weight:700;fill:#404040}
      .small{font-size:14px;fill:#595959}
      .tiny{font-size:12px;fill:#666666}
    </style>
  </defs>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="40" y="42" class="heading">PODGROUP AFFINITY</text>
  <text x="40" y="72" class="small">Place related replica PodGroups in the same Tier-1 HyperNode.</text>

  <rect x="40" y="100" width="820" height="480" rx="7" fill="#f7f7f7" stroke="#8c8c8c" stroke-width="2"/>
  <text x="65" y="132" class="section">HyperNode Cluster</text>
  <text x="835" y="132" class="tiny" text-anchor="end">Tier-1 = leaf switch / rack</text>

  <rect x="70" y="158" width="600" height="390" rx="6" fill="#eef6ee" stroke="#3b7d5c" stroke-width="3"/>
  <rect x="70" y="158" width="600" height="56" rx="6" fill="#d5e8d4" stroke="#3b7d5c" stroke-width="3"/>
  <rect x="70" y="204" width="600" height="10" fill="#d5e8d4"/>
  <text x="370" y="192" class="section" text-anchor="middle">Tier-1 HyperNode A</text>
  <rect x="287" y="226" width="166" height="32" rx="16" fill="#3b7d5c"/>
  <text x="370" y="247" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">CO-LOCATED</text>

  <rect x="95" y="278" width="260" height="220" rx="6" fill="#ffffff" stroke="#4e79a7" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="115" y="262" width="220" height="38" rx="19" fill="#4e79a7"/>
  <text x="225" y="287" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Serving PodGroup - Replica A</text>
  <text x="225" y="326" class="tiny" text-anchor="middle">Prefill and Decode share one PodGroup</text>
  <rect x="120" y="350" width="95" height="102" rx="5" fill="#d6e4f0" stroke="#4e79a7" stroke-width="2"/>
  <rect x="235" y="350" width="95" height="102" rx="5" fill="#eeeeee" stroke="#666666" stroke-width="2"/>
  <text x="167" y="388" class="label" text-anchor="middle">Prefill</text>
  <text x="167" y="414" class="tiny" text-anchor="middle">P-A</text>
  <text x="282" y="388" class="label" text-anchor="middle">Decode</text>
  <text x="282" y="414" class="tiny" text-anchor="middle">D-A</text>
  <path d="M215 401H235" fill="none" stroke="#595959" stroke-width="2"/>
  <text x="225" y="476" class="tiny" text-anchor="middle">KV transfer</text>

  <rect x="385" y="278" width="260" height="220" rx="6" fill="#ffffff" stroke="#4e79a7" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="405" y="262" width="220" height="38" rx="19" fill="#4e79a7"/>
  <text x="515" y="287" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">Serving PodGroup - Replica B</text>
  <text x="515" y="326" class="tiny" text-anchor="middle">Prefill and Decode share one PodGroup</text>
  <rect x="410" y="350" width="95" height="102" rx="5" fill="#d6e4f0" stroke="#4e79a7" stroke-width="2"/>
  <rect x="525" y="350" width="95" height="102" rx="5" fill="#eeeeee" stroke="#666666" stroke-width="2"/>
  <text x="457" y="388" class="label" text-anchor="middle">Prefill</text>
  <text x="457" y="414" class="tiny" text-anchor="middle">P-B</text>
  <text x="572" y="388" class="label" text-anchor="middle">Decode</text>
  <text x="572" y="414" class="tiny" text-anchor="middle">D-B</text>
  <path d="M505 401H525" fill="none" stroke="#595959" stroke-width="2"/>
  <text x="515" y="476" class="tiny" text-anchor="middle">KV transfer</text>
  <rect x="346" y="374" width="48" height="48" rx="24" fill="#ffffff" stroke="#3b7d5c" stroke-width="2"/>
  <text x="370" y="406" font-size="26" font-weight="700" fill="#3b7d5c" text-anchor="middle">+</text>
  <text x="370" y="526" font-size="14" font-weight="700" fill="#3b7d5c" text-anchor="middle">same leaf / failure domain</text>

  <rect x="700" y="158" width="130" height="390" rx="6" fill="#fafafa" stroke="#b3b3b3" stroke-width="2"/>
  <rect x="700" y="158" width="130" height="56" rx="6" fill="#eeeeee" stroke="#b3b3b3" stroke-width="2"/>
  <rect x="700" y="204" width="130" height="10" fill="#eeeeee"/>
  <text x="765" y="183" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">Tier-1</text>
  <text x="765" y="201" font-size="14" font-weight="700" fill="#666666" text-anchor="middle">HyperNode B</text>
  <text x="765" y="344" class="tiny" text-anchor="middle">available</text>
  <text x="765" y="364" class="tiny" text-anchor="middle">capacity</text>
</svg>

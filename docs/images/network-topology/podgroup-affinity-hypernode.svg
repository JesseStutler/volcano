  <text x="65" y="132" class="section">HyperNode Cluster</text>
  <text x="835" y="132" class="tiny" text-anchor="end">Tier-1 = leaf switch / rack</text>

  <rect x="70" y="158" width="500" height="390" rx="6" fill="#eef6ee" stroke="#3b7d5c" stroke-width="3"/>
  <rect x="70" y="158" width="500" height="56" rx="6" fill="#d5e8d4" stroke="#3b7d5c" stroke-width="3"/>
  <rect x="70" y="204" width="500" height="10" fill="#d5e8d4"/>

  <rect x="125" y="315" width="175" height="155" rx="5" fill="#f7faff" stroke="#6c8ebf" stroke-width="1.5"/>
  <rect x="340" y="315" width="175" height="155" rx="5" fill="#f7faff" stroke="#6c8ebf" stroke-width="1.5"/>
  <text x="212" y="340" class="tiny" text-anchor="middle">gpu-node-01</text>
  <text x="427" y="340" class="tiny" text-anchor="middle">gpu-node-02</text>
  <rect x="145" y="365" width="70" height="64" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <rect x="230" y="365" width="50" height="64" rx="4" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>

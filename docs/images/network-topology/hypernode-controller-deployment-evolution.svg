<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="520" viewBox="0 0 1920 520">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4d4d4d"/>
    </marker>
    <style>
      text { font-family: Arial, sans-serif; fill: #262626; }
      .section { font-size: 20px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill: #595959; }
      .box { fill: #fff; stroke: #666; stroke-width: 2; }
      .gray { fill: #f5f5f5; stroke: #8c8c8c; stroke-width: 2; }
      .blue { fill: #d6e4f0; stroke: #4e79a7; stroke-width: 3; }
      .edge { fill: none; stroke: #4d4d4d; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1920" height="520" fill="#fff"/>

  <text x="90" y="42" class="section">BEFORE</text>
  <rect x="70" y="60" width="650" height="390" rx="4" class="gray"/>
  <text x="395" y="102" class="label" text-anchor="middle">Volcano control plane</text>
  <rect x="120" y="135" width="550" height="240" rx="3" class="box"/>
  <text x="395" y="180" class="label" text-anchor="middle">vc-controller-manager</text>
  <rect x="160" y="225" width="210" height="70" rx="3" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="265" y="254" class="label" text-anchor="middle">HyperNode</text>
  <text x="265" y="278" class="small" text-anchor="middle">Controller</text>
  <rect x="420" y="225" width="210" height="70" rx="3" fill="#eee" stroke="#999" stroke-width="1.5"/>
  <text x="525" y="254" class="label" text-anchor="middle">Other</text>
  <text x="525" y="278" class="small" text-anchor="middle">Controllers</text>
  <text x="395" y="340" class="small" text-anchor="middle">One process · shared deployment · shared RBAC boundary</text>

  <path d="M760 255H900" class="edge"/>
  <rect x="770" y="185" width="120" height="48" rx="3" fill="#fff" stroke="#bfbfbf"/>
  <text x="830" y="205" class="small" text-anchor="middle">Deployment</text>
  <text x="830" y="224" class="small" text-anchor="middle">decoupling</text>

  <text x="950" y="42" class="section">NOW</text>
  <rect x="930" y="60" width="920" height="390" rx="4" class="gray"/>
  <rect x="980" y="120" width="350" height="130" rx="3" class="box"/>
  <text x="1155" y="165" class="label" text-anchor="middle">Embedded mode</text>
  <text x="1155" y="197" class="small" text-anchor="middle">Runs in vc-controller-manager</text>
  <text x="1155" y="223" class="small" text-anchor="middle">Default for existing Volcano users</text>
  <rect x="1450" y="120" width="350" height="130" rx="3" class="blue"/>
  <text x="1625" y="165" class="label" text-anchor="middle">Standalone mode</text>
  <text x="1625" y="197" class="small" text-anchor="middle">Dedicated binary and image</text>
  <text x="1625" y="223" class="small" text-anchor="middle">Independent Deployment and RBAC</text>

  <path d="M1155 250V305H1305" fill="none" stroke="#737373" stroke-width="2"/>
  <path d="M1625 250V305H1475" fill="none" stroke="#737373" stroke-width="2"/>
  <rect x="1190" y="305" width="400" height="78" rx="3" fill="#fff" stroke="#8c8c8c" stroke-width="2"/>
  <text x="1390" y="336" class="label" text-anchor="middle">Shared implementation</text>
  <text x="1390" y="362" class="small" text-anchor="middle">pkg/controllers/hypernode</text>
  <text x="1390" y="420" class="small" text-anchor="middle">Same HyperNode API, discovery configuration and reconciliation behavior</text>
</svg>

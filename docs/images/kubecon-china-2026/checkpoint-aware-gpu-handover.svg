<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="880" viewBox="0 0 1920 880">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#595959"/>
    </marker>
    <style>text{font-family:Arial,Helvetica,sans-serif}</style>
  </defs>
  <rect width="1920" height="880" fill="#ffffff"/>
  <rect x="70" y="40" width="240" height="40" rx="20" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="190" y="66" font-size="17" font-weight="700" fill="#595959" text-anchor="middle">FUTURE DIRECTION</text>
  <text x="960" y="68" font-size="19" fill="#404040" text-anchor="middle">Checkpoint turns GPU reclaim from restart into resume</text>

  <rect x="60" y="120" width="390" height="570" rx="8" fill="#ffffff" stroke="#8c8c8c" stroke-width="2"/>
  <text x="90" y="158" font-size="18" font-weight="700" fill="#28527d">T0 · TRAINING</text>
  <text x="255" y="193" font-size="17" font-weight="700" fill="#404040" text-anchor="middle">Training Job · 8 GPUs</text>
  <rect x="100" y="215" width="310" height="205" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="125" y="247" font-size="15" font-weight="700" fill="#1a1a1a">SubGroup A · GPU 0–3</text>
  <g fill="#ffffff" stroke="#666666" stroke-width="1.5">
    <rect x="125" y="260" width="52" height="42"/><rect x="194" y="260" width="52" height="42"/><rect x="263" y="260" width="52" height="42"/><rect x="332" y="260" width="52" height="42"/>
    <rect x="125" y="352" width="52" height="42"/><rect x="194" y="352" width="52" height="42"/><rect x="263" y="352" width="52" height="42"/><rect x="332" y="352" width="52" height="42"/>
  </g>
  <text x="151" y="287" font-size="14" fill="#404040" text-anchor="middle">0</text><text x="220" y="287" font-size="14" fill="#404040" text-anchor="middle">1</text><text x="289" y="287" font-size="14" fill="#404040" text-anchor="middle">2</text><text x="358" y="287" font-size="14" fill="#404040" text-anchor="middle">3</text>
  <text x="125" y="339" font-size="15" font-weight="700" fill="#1a1a1a">SubGroup B · GPU 4–7</text>
  <text x="151" y="379" font-size="14" fill="#404040" text-anchor="middle">4</text><text x="220" y="379" font-size="14" fill="#404040" text-anchor="middle">5</text><text x="289" y="379" font-size="14" fill="#404040" text-anchor="middle">6</text><text x="358" y="379" font-size="14" fill="#404040" text-anchor="middle">7</text>
  <rect x="100" y="460" width="310" height="90" rx="5" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="2"/>
  <text x="255" y="493" font-size="16" font-weight="700" fill="#404040" text-anchor="middle">Periodic checkpoint</text>
  <text x="255" y="522" font-size="15" fill="#666666" text-anchor="middle">last durable state: step 4200</text>
  <text x="255" y="620" font-size="16" fill="#595959" text-anchor="middle">Training makes progress</text>

  <path d="M450 405L510 405" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="510" y="120" width="390" height="570" rx="8" fill="#ffffff" stroke="#8c8c8c" stroke-width="2"/>
  <text x="540" y="158" font-size="18" font-weight="700" fill="#28527d">T1 · SERVING BURST</text>
  <rect x="550" y="215" width="310" height="130" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="705" y="257" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Serving PodGroup</text>
  <text x="705" y="290" font-size="16" fill="#404040" text-anchor="middle">needs 4 GPUs now</text>
  <text x="705" y="320" font-size="15" font-weight="700" fill="#527a45" text-anchor="middle">SLO-driven demand</text>
  <rect x="550" y="395" width="310" height="150" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="705" y="435" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Select victim unit</text>
  <text x="705" y="468" font-size="16" fill="#404040" text-anchor="middle">Training SubGroup B</text>
  <text x="705" y="500" font-size="15" fill="#666666" text-anchor="middle">release GPU 4–7 together</text>
  <text x="705" y="620" font-size="16" fill="#595959" text-anchor="middle">Do not evict arbitrary workers</text>

  <path d="M900 405L960 405" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="960" y="120" width="390" height="570" rx="8" fill="#ffffff" stroke="#8c8c8c" stroke-width="2"/>
  <text x="990" y="158" font-size="18" font-weight="700" fill="#28527d">T2 · CHECKPOINT BARRIER</text>
  <rect x="1000" y="210" width="310" height="110" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="1155" y="248" font-size="17" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pause SubGroup B</text>
  <text x="1155" y="280" font-size="15" fill="#404040" text-anchor="middle">ranks reach a safe barrier</text>
  <path d="M1155 320L1155 365" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="365" width="310" height="110" rx="5" fill="#f2f2f2" stroke="#8c8c8c" stroke-width="2"/>
  <text x="1155" y="403" font-size="17" font-weight="700" fill="#404040" text-anchor="middle">Write checkpoint</text>
  <text x="1155" y="435" font-size="15" fill="#666666" text-anchor="middle">durable state: step 4300</text>
  <path d="M1155 475L1155 520" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="1000" y="520" width="310" height="80" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="2"/>
  <text x="1155" y="552" font-size="17" font-weight="700" fill="#b85450" text-anchor="middle">Release GPU 4–7</text>
  <text x="1155" y="580" font-size="14" fill="#666666" text-anchor="middle">only after checkpoint succeeds</text>

  <path d="M1350 405L1410 405" fill="none" stroke="#595959" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="1410" y="120" width="450" height="570" rx="8" fill="#ffffff" stroke="#8c8c8c" stroke-width="2"/>
  <text x="1440" y="158" font-size="18" font-weight="700" fill="#28527d">T3 · HANDOVER &amp; RESUME</text>
  <rect x="1450" y="205" width="370" height="155" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="1635" y="244" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Serving takes GPU 4–7</text>
  <g fill="#ffffff" stroke="#82b366" stroke-width="1.5">
    <rect x="1505" y="270" width="52" height="48"/><rect x="1575" y="270" width="52" height="48"/><rect x="1645" y="270" width="52" height="48"/><rect x="1715" y="270" width="52" height="48"/>
  </g>
  <text x="1531" y="301" font-size="14" fill="#404040" text-anchor="middle">S0</text><text x="1601" y="301" font-size="14" fill="#404040" text-anchor="middle">S1</text><text x="1671" y="301" font-size="14" fill="#404040" text-anchor="middle">S2</text><text x="1741" y="301" font-size="14" fill="#404040" text-anchor="middle">S3</text>
  <path d="M1635 360L1635 410" fill="none" stroke="#595959" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="1715" y="397" font-size="14" fill="#666666" text-anchor="middle">capacity returns</text>
  <rect x="1450" y="430" width="370" height="155" rx="5" fill="#dae8fc" stroke="#6c8ebf" stroke-width="2"/>
  <text x="1635" y="470" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Training SubGroup B resumes</text>
  <text x="1635" y="507" font-size="16" fill="#404040" text-anchor="middle">restore from step 4300</text>
  <text x="1635" y="542" font-size="15" font-weight="700" fill="#28527d" text-anchor="middle">preserve completed work</text>
  <text x="1635" y="620" font-size="16" fill="#595959" text-anchor="middle">Serving SLO met · training continues</text>

  <rect x="190" y="735" width="650" height="90" rx="5" fill="#f8cecc" stroke="#b85450" stroke-width="2"/>
  <text x="515" y="770" font-size="17" font-weight="700" fill="#404040" text-anchor="middle">Hard eviction</text>
  <text x="515" y="800" font-size="15" fill="#666666" text-anchor="middle">release GPUs immediately · restart training from an older state</text>
  <rect x="1080" y="735" width="650" height="90" rx="5" fill="#d5e8d4" stroke="#82b366" stroke-width="2"/>
  <text x="1405" y="770" font-size="17" font-weight="700" fill="#404040" text-anchor="middle">Recoverable handover</text>
  <text x="1405" y="800" font-size="15" fill="#666666" text-anchor="middle">checkpoint first · release a complete unit · resume later</text>
</svg>

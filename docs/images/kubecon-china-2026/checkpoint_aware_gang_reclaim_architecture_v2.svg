<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="blue-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 4L0 8Z" fill="#2563eb"/>
    </marker>
    <marker id="green-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 4L0 8Z" fill="#17845b"/>
    </marker>
    <marker id="gray-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L10 4L0 8Z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC",sans-serif; fill:#102a43; }
      .boundary { font-size:12px; font-weight:700; letter-spacing:.8px; fill:#46657f; }
      .title { font-size:20px; font-weight:700; }
      .node-title { font-size:16px; font-weight:700; }
      .body { font-size:13px; fill:#5b7085; }
      .small { font-size:11px; fill:#617589; }
      .edge-label { font-size:12px; font-weight:600; fill:#35506b; }
      .green-label { font-size:12px; font-weight:600; fill:#287052; }
    </style>
  </defs>

  <rect width="1400" height="760" fill="#ffffff"/>

  <!-- Main boundaries -->
  <rect x="34" y="28" width="1332" height="214" rx="10" fill="#f8fbfe" stroke="#91abc1" stroke-width="1.4"
        data-graph-role="container" data-container-id="control-plane" data-semantic-role="boundary" data-graph-bounds="34,28,1366,242"/>
  <rect x="34" y="270" width="1332" height="456" rx="10" fill="#ffffff" stroke="#91abc1" stroke-width="1.4"
        data-graph-role="container" data-container-id="cluster" data-semantic-role="boundary" data-graph-bounds="34,270,1366,726"/>
  <rect x="34" y="28" width="6" height="214" rx="3" fill="#2563eb" data-graph-role="decoration" data-owner="control-plane"/>
  <rect x="34" y="270" width="6" height="456" rx="3" fill="#8196aa" data-graph-role="decoration" data-owner="cluster"/>

  <text x="58" y="54" class="boundary">VOLCANO CONTROL PLANE</text>
  <text x="58" y="296" class="boundary">KUBERNETES CLUSTER</text>

  <!-- Edges behind all components -->
  <!-- Queue and scheduler cooperate over two separate horizontal lanes -->
  <path d="M350 118H476" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
  <path d="M476 190H410V196H350" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#gray-arrow)"/>

  <!-- Scheduler and checkpoint coordinator use separate request/readiness lanes -->
  <path d="M804 118H930" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue-arrow)"/>
  <path d="M930 190H866V196H804" fill="none" stroke="#17845b" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#green-arrow)"/>

  <!-- Per-container checkpoint requests fan out through one clean bus -->
  <path d="M1090 206V316H590" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M230 316H1090" fill="none" stroke="#2563eb" stroke-width="2"/>
  <path d="M230 316V348" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>
  <path d="M590 316V348" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#blue-arrow)"/>

  <!-- Training container snapshots converge on the store -->
  <path d="M230 468V486H916" fill="none" stroke="#17845b" stroke-width="2"/>
  <path d="M590 468V486" fill="none" stroke="#17845b" stroke-width="2"/>
  <path d="M916 486V414H1010" fill="none" stroke="#17845b" stroke-width="2" marker-end="url(#green-arrow)"/>

  <!-- Store reports completeness to coordinator in a dedicated right corridor -->
  <path d="M1250 414H1318V176H1250" fill="none" stroke="#17845b" stroke-width="1.9" stroke-dasharray="7 5" marker-end="url(#green-arrow)"/>

  <!-- Scheduler commits only after the barrier is ready -->
  <path d="M640 206V254H950V534H900" fill="none" stroke="#2563eb" stroke-width="2.2" marker-end="url(#blue-arrow)"/>

  <!-- Edge labels -->
  <rect x="372" y="96" width="86" height="20" fill="#f8fbfe"/>
  <text x="415" y="111" text-anchor="middle" class="edge-label">admission</text>
  <rect x="370" y="176" width="92" height="20" fill="#f8fbfe"/>
  <text x="416" y="191" text-anchor="middle" class="edge-label">checkpointRef</text>
  <rect x="832" y="96" width="72" height="20" fill="#f8fbfe"/>
  <text x="868" y="111" text-anchor="middle" class="edge-label">checkpoint</text>
  <rect x="842" y="176" width="76" height="20" fill="#f8fbfe"/>
  <text x="880" y="191" text-anchor="middle" class="green-label">gang ready</text>
  <rect x="650" y="302" width="224" height="20" fill="#ffffff"/>
  <text x="762" y="317" text-anchor="middle" class="edge-label">per-container Kubelet API</text>
  <rect x="705" y="474" width="148" height="20" fill="#ffffff"/>
  <text x="779" y="489" text-anchor="middle" class="green-label">container snapshots</text>
  <rect x="1260" y="276" width="102" height="20" fill="#ffffff"/>
  <text x="1311" y="291" text-anchor="middle" class="green-label">all ranks ready</text>

  <!-- Queue -->
  <rect x="64" y="76" width="286" height="130" rx="8" fill="#ffffff" stroke="#7fa3c2" stroke-width="1.5"/>
  <text x="84" y="103" class="title">Volcano Queue</text>
  <rect x="84" y="120" width="246" height="32" rx="5" fill="#eef5ff" stroke="#9abbe0"/>
  <text x="100" y="141" class="node-title">Serving PodGroup</text>
  <text x="310" y="141" text-anchor="end" class="small">PENDING</text>
  <rect x="84" y="162" width="246" height="28" rx="5" fill="#f6f8fa" stroke="#c2ccd5" stroke-dasharray="5 4"/>
  <text x="100" y="181" class="body">Training PodGroup + checkpointRef</text>

  <!-- Scheduler -->
  <rect x="476" y="76" width="328" height="130" rx="8" fill="#eef5ff" stroke="#78a4d7" stroke-width="1.5"/>
  <text x="500" y="105" class="title">Volcano Scheduler</text>
  <line x1="500" y1="119" x2="780" y2="119" stroke="#b7cbe0"/>
  <text x="500" y="145" class="node-title">Select the victim PodGroup</text>
  <text x="500" y="176" class="node-title">Commit after the checkpoint barrier</text>

  <!-- Checkpoint coordinator -->
  <rect x="930" y="76" width="320" height="130" rx="8" fill="#ffffff" stroke="#78a4d7" stroke-width="1.5"/>
  <text x="954" y="105" class="title">Checkpoint Coordinator</text>
  <line x1="954" y1="119" x2="1226" y2="119" stroke="#c4d2df"/>
  <text x="954" y="145" class="node-title">Track every training container</text>
  <text x="954" y="176" class="node-title">Close the PodGroup barrier</text>

  <!-- Before state: running training gang -->
  <text x="70" y="336" class="boundary">BEFORE RECLAIM · TRAINING RUNNING</text>

  <rect x="70" y="348" width="320" height="120" rx="8" fill="#f8fafc" stroke="#aab8c5" stroke-width="1.3"
        data-graph-role="container" data-container-id="before-hypernode-a" data-semantic-role="boundary" data-graph-bounds="70,348,390,468"/>
  <text x="90" y="374" class="node-title">HyperNode A</text>
  <rect x="90" y="392" width="132" height="54" rx="6" fill="#ffffff" stroke="#9eb0c0"/>
  <text x="156" y="416" text-anchor="middle" class="node-title">Training T0</text>
  <text x="156" y="435" text-anchor="middle" class="small">Kubelet API</text>
  <rect x="238" y="392" width="132" height="54" rx="6" fill="#ffffff" stroke="#9eb0c0"/>
  <text x="304" y="416" text-anchor="middle" class="node-title">Training T1</text>
  <text x="304" y="435" text-anchor="middle" class="small">Kubelet API</text>

  <rect x="430" y="348" width="320" height="120" rx="8" fill="#f8fafc" stroke="#aab8c5" stroke-width="1.3"
        data-graph-role="container" data-container-id="before-hypernode-b" data-semantic-role="boundary" data-graph-bounds="430,348,750,468"/>
  <text x="450" y="374" class="node-title">HyperNode B</text>
  <rect x="450" y="392" width="132" height="54" rx="6" fill="#ffffff" stroke="#9eb0c0"/>
  <text x="516" y="416" text-anchor="middle" class="node-title">Training T2</text>
  <text x="516" y="435" text-anchor="middle" class="small">Kubelet API</text>
  <rect x="598" y="392" width="132" height="54" rx="6" fill="#ffffff" stroke="#9eb0c0"/>
  <text x="664" y="416" text-anchor="middle" class="node-title">Training T3</text>
  <text x="664" y="435" text-anchor="middle" class="small">Kubelet API</text>

  <!-- Shared store as the architectural anchor -->
  <g>
    <ellipse cx="1130" cy="378" rx="120" ry="18" fill="#eef8f3" stroke="#64a987" stroke-width="1.5"/>
    <rect x="1010" y="378" width="240" height="72" fill="#eef8f3"/>
    <line x1="1010" y1="378" x2="1010" y2="450" stroke="#64a987" stroke-width="1.5"/>
    <line x1="1250" y1="378" x2="1250" y2="450" stroke="#64a987" stroke-width="1.5"/>
    <ellipse cx="1130" cy="450" rx="120" ry="18" fill="#dff1e8" stroke="#64a987" stroke-width="1.5"/>
    <text x="1130" y="407" text-anchor="middle" class="node-title">PodGroup Checkpoint</text>
    <text x="1130" y="430" text-anchor="middle" class="body">T0 · T1 · T2 · T3</text>
  </g>

  <!-- Transaction barrier -->
  <rect x="70" y="512" width="830" height="44" rx="7" fill="#edf7f2" stroke="#64a987" stroke-width="1.5"/>
  <circle cx="96" cy="534" r="11" fill="#17845b"/>
  <path d="M90 534L95 539L103 529" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="540" class="node-title" style="fill:#245c45">Checkpoint complete — commit gang reclaim and serving admission</text>

  <!-- After state: serving gang occupies the reclaimed placement -->
  <text x="70" y="590" class="boundary">AFTER COMMIT · SERVING ADMITTED</text>

  <rect x="70" y="602" width="320" height="100" rx="8" fill="#f8fafc" stroke="#aab8c5" stroke-width="1.3"
        data-graph-role="container" data-container-id="after-hypernode-a" data-semantic-role="boundary" data-graph-bounds="70,602,390,702"/>
  <text x="90" y="628" class="node-title">HyperNode A</text>
  <rect x="90" y="646" width="132" height="38" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="156" y="670" text-anchor="middle" class="node-title">Serving S0</text>
  <rect x="238" y="646" width="132" height="38" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="304" y="670" text-anchor="middle" class="node-title">Serving S1</text>

  <rect x="430" y="602" width="320" height="100" rx="8" fill="#f8fafc" stroke="#aab8c5" stroke-width="1.3"
        data-graph-role="container" data-container-id="after-hypernode-b" data-semantic-role="boundary" data-graph-bounds="430,602,750,702"/>
  <text x="450" y="628" class="node-title">HyperNode B</text>
  <rect x="450" y="646" width="132" height="38" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="516" y="670" text-anchor="middle" class="node-title">Serving S2</text>
  <rect x="598" y="646" width="132" height="38" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="664" y="670" text-anchor="middle" class="node-title">Serving S3</text>

</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <marker id="blueArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#4e79a7"/></marker>
    <marker id="greenArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#3b7d5c"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#26384a}
      .eyebrow{font-size:12px;font-weight:700;letter-spacing:.8px;fill:#526d82}
      .title{font-size:20px;font-weight:700;fill:#18354f}
      .label{font-size:15px;font-weight:700}
      .body{font-size:13px;fill:#52606d}
      .tiny{font-size:12px;fill:#66788a}
      .white{fill:#ffffff}
    </style>
  </defs>
  <rect width="1400" height="760" fill="#ffffff"/>
  <rect x="34" y="30" width="1332" height="700" rx="10" fill="#ffffff" stroke="#8da4b8" stroke-width="1.6"/>
  <rect x="34" y="30" width="6" height="700" rx="3" fill="#708aa0"/>
  <text x="62" y="60" class="eyebrow">CHECKPOINT-AWARE GANG RECLAIM</text>
  <rect x="1124" y="42" width="210" height="28" rx="14" fill="#eef5ff" stroke="#7fa3c2"/>
  <text x="1229" y="61" font-size="12" font-weight="700" fill="#355e87" text-anchor="middle">PROPOSED VOLCANO EVOLUTION</text>

  <!-- Queue pressure -->
  <rect x="70" y="92" width="300" height="176" rx="8" fill="#f8fbfe" stroke="#7fa3c2" stroke-width="1.6"/>
  <text x="92" y="122" class="title">Queue pressure</text>
  <line x1="92" y1="136" x2="348" y2="136" stroke="#c4d2df"/>
  <rect x="92" y="150" width="256" height="42" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="108" y="169" class="label">Serving Queue</text>
  <text x="108" y="185" class="tiny">Pending PodGroup · short 4 GPUs</text>
  <rect x="92" y="204" width="256" height="42" rx="6" fill="#f7f7f7" stroke="#aab8c5"/>
  <text x="108" y="223" class="label">Training Queue</text>
  <text x="108" y="239" class="tiny">Borrowed capacity · return 4 GPUs</text>

  <!-- Gang reclaim -->
  <rect x="420" y="92" width="300" height="176" rx="8" fill="#eef5ff" stroke="#78a4d7" stroke-width="1.6"/>
  <text x="442" y="122" class="title">Gang Reclaim</text>
  <line x1="442" y1="136" x2="698" y2="136" stroke="#b7cbe0"/>
  <circle cx="458" cy="159" r="11" fill="#4e79a7"/><text x="458" y="164" class="white" font-size="12" font-weight="700" text-anchor="middle">1</text>
  <text x="480" y="164" class="label">Select complete victim PodGroup</text>
  <circle cx="458" cy="199" r="11" fill="#4e79a7"/><text x="458" y="204" class="white" font-size="12" font-weight="700" text-anchor="middle">2</text>
  <text x="480" y="204" class="label">Create ReclaimIntent</text>
  <rect x="442" y="222" width="256" height="28" rx="5" fill="#ffffff" stroke="#b85450" stroke-width="1.4"/>
  <text x="570" y="241" font-size="12" font-weight="700" fill="#8a3b37" text-anchor="middle">No eviction before all ranks are ready</text>

  <!-- Training controller -->
  <rect x="770" y="92" width="560" height="176" rx="8" fill="#f8fbfe" stroke="#78a4d7" stroke-width="1.6"/>
  <text x="792" y="122" class="title">Training Controller</text>
  <line x1="792" y1="136" x2="1308" y2="136" stroke="#c4d2df"/>
  <text x="792" y="160" class="label">Coordinate one gang checkpoint</text>
  <text x="792" y="181" class="body">Fan out checkpoint requests and preserve the rank-to-shard mapping.</text>
  <rect x="792" y="200" width="90" height="34" rx="5" fill="#edf7f2" stroke="#64a987"/><text x="837" y="222" class="label" fill="#285f49" text-anchor="middle">T0 ✓</text>
  <rect x="892" y="200" width="90" height="34" rx="5" fill="#edf7f2" stroke="#64a987"/><text x="937" y="222" class="label" fill="#285f49" text-anchor="middle">T1 ✓</text>
  <rect x="992" y="200" width="90" height="34" rx="5" fill="#edf7f2" stroke="#64a987"/><text x="1037" y="222" class="label" fill="#285f49" text-anchor="middle">T2 ✓</text>
  <rect x="1092" y="200" width="90" height="34" rx="5" fill="#edf7f2" stroke="#64a987"/><text x="1137" y="222" class="label" fill="#285f49" text-anchor="middle">T3 ✓</text>
  <rect x="1192" y="200" width="116" height="34" rx="17" fill="#3b7d5c"/>
  <text x="1250" y="222" class="white" font-size="13" font-weight="700" text-anchor="middle">4/4 ranks ready</text>

  <!-- Short control-plane connectors -->
  <path d="M370 180H420" fill="none" stroke="#4e79a7" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <text x="395" y="168" class="tiny" text-anchor="middle">demand</text>
  <path d="M720 180H770" fill="none" stroke="#4e79a7" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <text x="745" y="151" class="tiny" text-anchor="middle">Reclaim</text>
  <text x="745" y="165" class="tiny" text-anchor="middle">Intent</text>

  <!-- Physical victim placement -->
  <rect x="70" y="310" width="650" height="264" rx="8" fill="#f8fafc" stroke="#91a6b8" stroke-width="1.6"/>
  <text x="92" y="340" class="title">Tier-1 HyperNode · victim placement</text>
  <text x="698" y="340" class="tiny" text-anchor="end">one complete Training PodGroup</text>
  <rect x="92" y="358" width="606" height="166" rx="7" fill="#ffffff" stroke="#4e79a7" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="250" y="342" width="290" height="34" rx="17" fill="#4e79a7"/>
  <text x="395" y="365" class="white" font-size="14" font-weight="700" text-anchor="middle">Training PodGroup · selected victim</text>
  <rect x="112" y="398" width="130" height="92" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <rect x="257" y="398" width="130" height="92" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <rect x="402" y="398" width="130" height="92" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <rect x="547" y="398" width="130" height="92" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="177" y="432" class="label" text-anchor="middle">GPU 0 · T0</text><text x="177" y="455" class="tiny" text-anchor="middle">rank snapshot ✓</text><text x="177" y="475" class="tiny" text-anchor="middle">running</text>
  <text x="322" y="432" class="label" text-anchor="middle">GPU 1 · T1</text><text x="322" y="455" class="tiny" text-anchor="middle">rank snapshot ✓</text><text x="322" y="475" class="tiny" text-anchor="middle">running</text>
  <text x="467" y="432" class="label" text-anchor="middle">GPU 2 · T2</text><text x="467" y="455" class="tiny" text-anchor="middle">rank snapshot ✓</text><text x="467" y="475" class="tiny" text-anchor="middle">running</text>
  <text x="612" y="432" class="label" text-anchor="middle">GPU 3 · T3</text><text x="612" y="455" class="tiny" text-anchor="middle">rank snapshot ✓</text><text x="612" y="475" class="tiny" text-anchor="middle">running</text>
  <rect x="185" y="535" width="420" height="26" rx="13" fill="#ffffff" stroke="#b85450"/>
  <text x="395" y="553" font-size="12" font-weight="700" fill="#8a3b37" text-anchor="middle">EVICTION GATE · locked until checkpoint manifest is complete</text>

  <!-- Checkpoint artifact -->
  <rect x="770" y="310" width="560" height="264" rx="8" fill="#f7fbf9" stroke="#64a987" stroke-width="1.6"/>
  <text x="792" y="340" class="title">Shared checkpoint storage</text>
  <text x="1308" y="340" class="tiny" text-anchor="end">durable recovery contract</text>
  <rect x="792" y="358" width="220" height="150" rx="7" fill="#ffffff" stroke="#64a987"/>
  <text x="812" y="385" class="label">Rank snapshots</text>
  <rect x="812" y="400" width="82" height="32" rx="5" fill="#edf7f2" stroke="#8bc0a5"/><text x="853" y="421" class="tiny" text-anchor="middle">T0.ckpt</text>
  <rect x="908" y="400" width="82" height="32" rx="5" fill="#edf7f2" stroke="#8bc0a5"/><text x="949" y="421" class="tiny" text-anchor="middle">T1.ckpt</text>
  <rect x="812" y="444" width="82" height="32" rx="5" fill="#edf7f2" stroke="#8bc0a5"/><text x="853" y="465" class="tiny" text-anchor="middle">T2.ckpt</text>
  <rect x="908" y="444" width="82" height="32" rx="5" fill="#edf7f2" stroke="#8bc0a5"/><text x="949" y="465" class="tiny" text-anchor="middle">T3.ckpt</text>
  <text x="902" y="494" class="tiny" text-anchor="middle">model / optimizer shards</text>
  <rect x="1032" y="358" width="276" height="160" rx="7" fill="#ffffff" stroke="#64a987"/>
  <text x="1052" y="385" class="label">PodGroup checkpoint manifest</text>
  <text x="1052" y="414" class="body">• step + RNG + dataloader state</text>
  <text x="1052" y="440" class="body">• world size + rank / shard mapping</text>
  <text x="1052" y="466" class="body">• all snapshot object references</text>
  <rect x="1052" y="478" width="236" height="34" rx="5" fill="#edf7f2" stroke="#64a987"/>
  <text x="1170" y="500" font-size="13" font-weight="700" fill="#285f49" text-anchor="middle">checkpointRef created atomically</text>
  <path d="M720 444H770" fill="none" stroke="#3b7d5c" stroke-width="2.2" marker-end="url(#greenArrow)"/>
  <path d="M1050 268V310" fill="none" stroke="#4e79a7" stroke-width="2.2" marker-end="url(#blueArrow)"/>
  <text x="1064" y="292" class="tiny">coordinate + verify</text>
  <rect x="956" y="532" width="188" height="28" rx="14" fill="#3b7d5c"/>
  <text x="1050" y="551" class="white" font-size="12" font-weight="700" text-anchor="middle">BARRIER OPEN · 4/4 READY</text>
  <path d="M1050 560V610" fill="none" stroke="#3b7d5c" stroke-width="2.2" marker-end="url(#greenArrow)"/>
  <text x="1065" y="590" class="tiny">commit</text>

  <!-- Atomic handover -->
  <rect x="70" y="610" width="1260" height="88" rx="8" fill="#fbfcfd" stroke="#91a6b8" stroke-width="1.5"/>
  <text x="92" y="637" class="eyebrow">ATOMIC HANDOVER AFTER THE CHECKPOINT BARRIER</text>
  <rect x="92" y="642" width="420" height="46" rx="6" fill="#fff4f3" stroke="#b85450"/>
  <text x="302" y="660" class="label" fill="#7f2f2b" text-anchor="middle">Evict whole PodGroup</text>
  <text x="302" y="680" class="tiny" text-anchor="middle">victim requeued with checkpointRef / restoreFrom</text>
  <path d="M512 665H566" fill="none" stroke="#4e79a7" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="566" y="642" width="260" height="46" rx="6" fill="#f7f7f7" stroke="#aab8c5"/>
  <text x="696" y="670" class="label" text-anchor="middle">Release 4 GPUs</text>
  <path d="M826 665H880" fill="none" stroke="#4e79a7" stroke-width="2" marker-end="url(#blueArrow)"/>
  <rect x="880" y="642" width="428" height="46" rx="6" fill="#eef5ff" stroke="#78a4d7"/>
  <text x="1094" y="670" class="label" text-anchor="middle">Admit Serving PodGroup as a gang</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" role="img" aria-labelledby="title desc">
<title id="title">一个 Pool，两个 ResourceSlice</title><desc id="desc">同一 driver 和 pool，两个 Slice 都是第1代；各含一个唯一设备。</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d8e2dc"/></pattern></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1160" height="500" rx="20" fill="#fafbf8"/>
<rect width="1160" height="500" rx="20" fill="url(#grid)"/>
<rect x="28" y="28" width="1104" height="366" rx="14" fill="#edf3f9" stroke="#b6c9de"/>
<text x="52" y="66" font-size="24" font-weight="650" fill="#3568a5">NODE  node-a</text>
<rect x="52" y="92" width="1056" height="276" rx="14" fill="#eaf3ed" stroke="#a7cdb8"/>
<text x="76" y="128" font-size="23" font-weight="650" fill="#0c7b70">POOL  (gpu.example.com, node-a)</text>
<text x="76" y="155" font-size="16" font-weight="400" fill="#64757d">generation: 1   ·   resourceSliceCount: 2</text>
<g data-kind="slice" data-name="node-a-gpus-1">
<rect x="76" y="180" width="502" height="158" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="92" y="198" width="4" height="17" rx="2" fill="#0c7b70" stroke="#0c7b70"/>
<text x="106" y="212" font-size="13" font-weight="700" fill="#0c7b70">RESOURCE SLICE</text>
<text x="98" y="246" font-size="23" font-weight="650" fill="#183341">node-a-gpus-1</text>
<text x="98" y="274" font-size="14" font-weight="400" fill="#64757d">devices: [gpu-0]</text>
<text x="98" y="298" font-size="14" font-weight="400" fill="#64757d">同一代库存的一部分</text>
</g>
<g data-kind="slice" data-name="node-a-gpus-2">
<rect x="602" y="180" width="502" height="158" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="618" y="198" width="4" height="17" rx="2" fill="#0c7b70" stroke="#0c7b70"/>
<text x="632" y="212" font-size="13" font-weight="700" fill="#0c7b70">RESOURCE SLICE</text>
<text x="624" y="246" font-size="23" font-weight="650" fill="#183341">node-a-gpus-2</text>
<text x="624" y="274" font-size="14" font-weight="400" fill="#64757d">devices: [gpu-1]</text>
<text x="624" y="298" font-size="14" font-weight="400" fill="#64757d">同一代库存的一部分</text>
</g>
<text x="52" y="444" font-size="24" font-weight="650" fill="#183341">两张卡，两个 Slice，一个 Pool，一个 Node。</text>
</svg>
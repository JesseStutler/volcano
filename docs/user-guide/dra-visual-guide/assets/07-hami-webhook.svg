<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 450" role="img" aria-labelledby="title desc">
<title id="title">HAMi webhook 字段对应</title><desc id="desc">Pod limits 转为 ResourceClaim capacity 并补充 Pod claim 引用。</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d8e2dc"/></pattern></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1160" height="450" rx="20" fill="#fafbf8"/>
<rect width="1160" height="450" rx="20" fill="url(#grid)"/>
<g data-kind="pod" data-name="inference-compatible">
<rect x="28" y="32" width="500" height="268" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="44" y="50" width="4" height="17" rx="2" fill="#536574" stroke="#536574"/>
<text x="58" y="64" font-size="13" font-weight="700" fill="#536574">POD · 用户提交</text>
<text x="50" y="98" font-size="23" font-weight="650" fill="#183341">inference-compatible</text>
<text x="50" y="126" font-size="14" font-weight="400" fill="#64757d">resources.limits:</text>
<text x="50" y="150" font-size="14" font-weight="400" fill="#64757d">nvidia.com/gpu: 1</text>
<text x="50" y="174" font-size="14" font-weight="400" fill="#64757d">nvidia.com/gpucores: 50</text>
<text x="50" y="198" font-size="14" font-weight="400" fill="#64757d">nvidia.com/gpumem: 10240</text>
</g>
<g data-kind="claim" data-name="生成的 Claim">
<rect x="632" y="32" width="500" height="268" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="648" y="50" width="4" height="17" rx="2" fill="#b66b28" stroke="#b66b28"/>
<text x="662" y="64" font-size="13" font-weight="700" fill="#b66b28">RESOURCE CLAIM · webhook 创建</text>
<text x="654" y="98" font-size="23" font-weight="650" fill="#183341">生成的 Claim</text>
<text x="654" y="126" font-size="14" font-weight="400" fill="#64757d">exactly:</text>
<text x="654" y="150" font-size="14" font-weight="400" fill="#64757d">count: 1</text>
<text x="654" y="174" font-size="14" font-weight="400" fill="#64757d">capacity.requests.cores: 50</text>
<text x="654" y="198" font-size="14" font-weight="400" fill="#64757d">capacity.requests.memory: 10Gi</text>
</g>
<polyline points="528,174 632,174" fill="none" stroke="#b66b28" stroke-width="2" stroke-linejoin="round"/>
<circle cx="632" cy="174" r="4" fill="#b66b28"/>
<polyline points="528,198 632,198" fill="none" stroke="#b66b28" stroke-width="2" stroke-linejoin="round"/>
<circle cx="632" cy="198" r="4" fill="#b66b28"/>
<polyline points="528,222 632,222" fill="none" stroke="#b66b28" stroke-width="2" stroke-linejoin="round"/>
<circle cx="632" cy="222" r="4" fill="#b66b28"/>
<text x="546" y="155" font-size="16" font-weight="650" fill="#b66b28">转换</text>
<rect x="28" y="332" width="1104" height="82" rx="14" fill="#183341" stroke="#183341"/>
<text x="52" y="365" font-size="22" font-weight="600" fill="white">Pod 同时补上 Claim 引用，移除已转换的 GPU limits。</text>
<text x="52" y="393" font-size="16" font-weight="400" fill="#bed5ca">10240 MiB = 10 GiB  ·  这里的 Claim 名称只是示意，实际由 webhook 生成。</text>
</svg>
</g>
<rect x="32" y="512" width="1096" height="46" rx="10" fill="#f1ebf6" stroke="#d5c4e2"/>
<text x="52" y="541" font-size="18" font-weight="600" fill="#8054a6">4 张 + 2 张 ≠ 6 张物理 GPU。Class 是重叠视图，不能直接相加。</text>

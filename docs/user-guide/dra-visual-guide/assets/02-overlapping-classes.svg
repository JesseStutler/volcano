<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 580" role="img" aria-labelledby="title desc">
<title id="title">DeviceClass 是可重叠的选择条件</title><desc id="desc">gpu-any 匹配 node-a 和 node-b 的四张 GPU；gpu-a100 只匹配 node-a 的两张 A100。同一张 A100 同时属于两个匹配集合，但仍是一张物理设备。</desc>
<defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.7" fill="#d8e2dc"/></pattern></defs>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif} .mono{font-family:"DejaVu Sans Mono",monospace}</style>
<rect width="1160" height="580" rx="20" fill="#fafbf8"/>
<rect width="1160" height="580" rx="20" fill="url(#grid)"/>
<g data-kind="cls">
<rect x="32" y="30" width="526" height="120" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="48" y="48" width="4" height="17" rx="2" fill="#8054a6" stroke="#8054a6"/>
<text x="62" y="62" font-size="13" font-weight="700" fill="#8054a6">DEVICE CLASS · cluster</text>
<text x="54" y="96" font-size="23" font-weight="650" fill="#183341">gpu-any</text>
<text x="54" y="124" font-size="14" font-weight="400" fill="#64757d">driver == gpu.example.com → 匹配 4 张卡</text>
</g>
<g data-kind="cls">
<rect x="602" y="30" width="526" height="120" rx="14" fill="white" stroke="#d9e1df"/>
<rect x="618" y="48" width="4" height="17" rx="2" fill="#8054a6" stroke="#8054a6"/>
<text x="632" y="62" font-size="13" font-weight="700" fill="#8054a6">DEVICE CLASS · cluster</text>
<text x="624" y="96" font-size="23" font-weight="650" fill="#183341">gpu-a100</text>
<text x="624" y="124" font-size="14" font-weight="400" fill="#64757d">相同 driver，且 model == A100 → 匹配 2 张卡</text>
</g>
<polyline points="180,150 180,230" fill="none" stroke="#8054a6" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 6"/>

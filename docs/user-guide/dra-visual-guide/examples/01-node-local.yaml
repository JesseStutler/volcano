# 教学示例：Kubernetes resource.k8s.io/v1，假想驱动 gpu.example.com。
# Node 展示已有节点；ResourceSlice 通常由真实 DRA 驱动发布。
# 手工创建这些对象不会产生 GPU 或安装驱动。三个示例独立阅读。
apiVersion: v1
kind: Node
metadata:
  name: node-a
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: node-a-gpus
spec:
  driver: gpu.example.com
  nodeName: node-a
  pool:
    name: node-a
    generation: 1
    resourceSliceCount: 1
  devices:
  - name: gpu-0
    attributes:
      model:
        string: A100
  - name: gpu-1
    attributes:
      model:
        string: A100
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu-any
spec:
  selectors:
  - cel:
      expression: 'device.driver == "gpu.example.com"'
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: train-gpu
  namespace: default
spec:
  devices:
    requests:
    - name: accelerator
      exactly:
        deviceClassName: gpu-any
        allocationMode: ExactCount
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer
  namespace: default
spec:
  schedulerName: volcano
  restartPolicy: Never
  resourceClaims:
  - name: gpu
    resourceClaimName: train-gpu
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    resources:
      claims:
      - name: gpu
        request: accelerator

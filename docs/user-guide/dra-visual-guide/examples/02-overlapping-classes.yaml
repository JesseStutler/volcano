# 教学示例：两个节点，两个可重叠的 DeviceClass。
# gpu-any 匹配四张卡；gpu-a100 只匹配 node-a 上的两张卡。
apiVersion: v1
kind: Node
metadata:
  name: node-a
---
apiVersion: v1
kind: Node
metadata:
  name: node-b
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: node-a-gpus
spec:
  driver: gpu.example.com
  nodeName: node-a
  pool:
    name: node-a
    generation: 1
    resourceSliceCount: 1
  devices:
  - name: gpu-0
    attributes:
      model:
        string: A100
  - name: gpu-1
    attributes:
      model:
        string: A100
---
apiVersion: resource.k8s.io/v1
kind: ResourceSlice
metadata:
  name: node-b-gpus
spec:
  driver: gpu.example.com
  nodeName: node-b
  pool:
    name: node-b
    generation: 1
    resourceSliceCount: 1
  devices:
  - name: gpu-0
    attributes:
      model:
        string: H100
  - name: gpu-1
    attributes:
      model:
        string: H100
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu-any
spec:
  selectors:
  - cel:
      expression: 'device.driver == "gpu.example.com"'
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: gpu-a100
spec:
  selectors:
  - cel:
      expression: >-
        device.driver == "gpu.example.com" &&
        device.attributes["gpu.example.com"].model == "A100"
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: a100-gpu
  namespace: default
spec:
  devices:
    requests:
    - name: accelerator
      exactly:
        deviceClassName: gpu-a100
        allocationMode: ExactCount
        count: 1
---
apiVersion: v1
kind: Pod
metadata:
  name: trainer-a100
  namespace: default
spec:
  schedulerName: volcano
  restartPolicy: Never
  resourceClaims:
  - name: gpu
    resourceClaimName: a100-gpu
  containers:
  - name: app
    image: busybox:1.36
    command: ["sh", "-c", "sleep 3600"]
    resources:
      claims:
      - name: gpu

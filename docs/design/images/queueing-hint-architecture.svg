<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980" width="980" height="980">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 23px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .section { font-size: 13px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 11px; fill: #4b5563; }
    .label { font-size: 11px; font-weight: 700; fill: #374151; }
    .tiny { font-size: 10px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#16a34a"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ea580c"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563eb"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#9333ea"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker>
  </defs>

  <rect width="980" height="980" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" class="title">Volcano QueueingHint Data Flow</text>
  <text x="490" y="56" text-anchor="middle" class="subtitle">Job-level cache for session scheduling; hints only lift cached skip and trigger normal retry.</text>

  <rect x="48" y="82" width="884" height="142" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="68" y="107" class="section">1. Registration path</text>
  <rect x="92" y="130" width="170" height="58" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="177" y="154" text-anchor="middle" class="node-title">Scheduler plugin</text>
  <text x="177" y="172" text-anchor="middle" class="node-sub">optional HintProvider</text>
  <rect x="405" y="130" width="170" height="58" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="490" y="154" text-anchor="middle" class="node-title">EventsToRegister</text>
  <text x="490" y="172" text-anchor="middle" class="node-sub">ClusterEventWithHint</text>
  <rect x="718" y="130" width="170" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="803" y="154" text-anchor="middle" class="node-title">HintRegistry</text>
  <text x="803" y="172" text-anchor="middle" class="node-sub">cache-scoped copy</text>
  <path d="M262 159 H405" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#purple)"/>
  <text x="334" y="147" text-anchor="middle" class="label">register events</text>
  <path d="M575 159 H718" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#purple)"/>
  <text x="647" y="147" text-anchor="middle" class="label">store by plugin</text>

  <rect x="48" y="252" width="884" height="196" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="68" y="277" class="section">2. Failure record path</text>
  <rect x="92" y="315" width="150" height="68" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="167" y="343" text-anchor="middle" class="node-title">CloseSession</text>
  <text x="167" y="363" text-anchor="middle" class="node-sub">evaluated Job failed</text>
  <rect x="318" y="302" width="170" height="94" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="403" y="331" text-anchor="middle" class="node-title">Rejections</text>
  <text x="403" y="353" text-anchor="middle" class="node-sub">Status.Plugin</text>
  <text x="403" y="371" text-anchor="middle" class="node-sub">session vote table</text>
  <rect x="564" y="302" width="170" height="94" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="649" y="331" text-anchor="middle" class="node-title">Record Job</text>
  <text x="649" y="353" text-anchor="middle" class="node-sub">copy matching hints</text>
  <text x="649" y="371" text-anchor="middle" class="node-sub">set RetryAfter</text>
  <rect x="785" y="302" width="110" height="94" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="840" y="331" text-anchor="middle" class="node-title">Indexes</text>
  <text x="840" y="353" text-anchor="middle" class="node-sub">records</text>
  <text x="840" y="371" text-anchor="middle" class="node-sub">byEvent</text>
  <path d="M242 349 H318" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="280" y="337" text-anchor="middle" class="label">collect</text>
  <path d="M488 349 H564" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="526" y="337" text-anchor="middle" class="label">all plugins have hints</text>
  <path d="M734 349 H785" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="760" y="337" text-anchor="middle" class="label">store</text>
  <rect x="330" y="410" width="250" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="455" y="426" text-anchor="middle" class="tiny">unattributed / no HintProvider: do not cache</text>
  <path d="M734 319 C780 268 800 224 803 188" stroke="#9333ea" stroke-width="1.7" stroke-dasharray="6,5" fill="none" marker-end="url(#purple)"/>
  <text x="818" y="256" class="label">read registry</text>

  <rect x="48" y="476" width="884" height="166" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="68" y="501" class="section">3. Session skip path</text>
  <rect x="92" y="536" width="145" height="58" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="164" y="560" text-anchor="middle" class="node-title">OpenSession</text>
  <text x="164" y="578" text-anchor="middle" class="node-sub">pending Job</text>
  <rect x="310" y="536" width="145" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="382" y="560" text-anchor="middle" class="node-title">ShouldSkip</text>
  <text x="382" y="578" text-anchor="middle" class="node-sub">record valid?</text>
  <rect x="528" y="536" width="145" height="58" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="600" y="560" text-anchor="middle" class="node-title">SkipPredicate</text>
  <text x="600" y="578" text-anchor="middle" class="node-sub">session flag</text>
  <rect x="746" y="526" width="145" height="78" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="818" y="554" text-anchor="middle" class="node-title">Actions</text>
  <text x="818" y="574" text-anchor="middle" class="node-sub">skip enqueue /</text>
  <text x="818" y="592" text-anchor="middle" class="node-sub">allocate / backfill</text>
  <path d="M237 565 H310" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="274" y="553" text-anchor="middle" class="label">query</text>
  <path d="M455 565 H528" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="492" y="553" text-anchor="middle" class="label">valid</text>
  <path d="M673 565 H746" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="710" y="553" text-anchor="middle" class="label">bypass</text>
  <rect x="306" y="606" width="180" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="396" y="622" text-anchor="middle" class="tiny">missing / expired: evaluate normally</text>
  <path d="M600 594 C650 633 760 633 840 604" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#gray)"/>
  <text x="720" y="632" text-anchor="middle" class="label">preempt / reclaim ignore this flag</text>

  <rect x="48" y="670" width="884" height="206" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="68" y="695" class="section">4. Event wake-up path</text>
  <rect x="82" y="735" width="130" height="62" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="147" y="761" text-anchor="middle" class="node-title">Informer</text>
  <text x="147" y="779" text-anchor="middle" class="node-sub">cluster change</text>
  <rect x="270" y="735" width="140" height="62" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="340" y="761" text-anchor="middle" class="node-title">Dispatcher</text>
  <text x="340" y="779" text-anchor="middle" class="node-sub">ClusterEvent</text>
  <rect x="468" y="735" width="140" height="62" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="538" y="761" text-anchor="middle" class="node-title">OnEvent</text>
  <text x="538" y="779" text-anchor="middle" class="node-sub">lookup byEvent</text>
  <rect x="666" y="735" width="140" height="62" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="736" y="761" text-anchor="middle" class="node-title">JobHintFn</text>
  <text x="736" y="779" text-anchor="middle" class="node-sub">copied rejection</text>
  <rect x="470" y="828" width="170" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="555" y="850" text-anchor="middle" class="node-title">Forget record</text>
  <path d="M212 766 H270" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="241" y="754" text-anchor="middle" class="label">event</text>
  <path d="M410 766 H468" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="439" y="754" text-anchor="middle" class="label">subscribed</text>
  <path d="M608 766 H666" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="637" y="754" text-anchor="middle" class="label">run hint</text>
  <path d="M736 797 C720 842 670 845 640 845" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="718" y="834" class="label">HintWakeup / error</text>
  <path d="M555 828 C490 790 455 760 410 735" stroke="#2563eb" stroke-width="1.7" stroke-dasharray="6,5" fill="none" marker-end="url(#blue)"/>
  <text x="450" y="828" text-anchor="end" class="label">next session retries normally</text>

  <rect x="112" y="916" width="756" height="34" rx="7" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="136" cy="933" r="5" fill="#9333ea"/><text x="150" y="937" class="tiny">registration</text>
  <circle cx="258" cy="933" r="5" fill="#ea580c"/><text x="272" y="937" class="tiny">failure record</text>
  <circle cx="405" cy="933" r="5" fill="#16a34a"/><text x="419" y="937" class="tiny">session skip</text>
  <circle cx="538" cy="933" r="5" fill="#2563eb"/><text x="552" y="937" class="tiny">event wake-up</text>
  <text x="680" y="937" class="tiny">HintWakeup means retry, not guaranteed schedulable.</text>
</svg>

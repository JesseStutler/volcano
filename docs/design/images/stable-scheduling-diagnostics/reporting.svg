<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="764" viewBox="0 0 1120 764" role="img" aria-labelledby="title desc">
  <title id="title">Scheduling diagnostics and publication</title>
  <desc id="desc">Actions prepare native Pod conditions and a group summary in session JobInfo. At session close, gang prepares the group condition, JobUpdater compares group status, and the cache updates PodGroup status when required before RecordJobStatusEvent. The Pod helper compares its optional condition and live nomination independently. Unchanged inputs skip the Pod Event and status write. PodGroup Event deduplication remains separate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#475569" stroke-width="1.5"/></marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#245b88" stroke-width="1.5"/></marker>
  </defs>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; font-size: 16px; fill: #263340; }
    .title { font-size: 24px; font-weight: 600; fill: #182632; }
    .label { font-size: 14px; fill: #586572; }
    .code { font-family: 'DejaVu Sans Mono', monospace; font-size: 14px; }
    .strong { font-weight: 600; }
    .blue { fill: #245b88; }
    .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
    .accepted { fill: none; stroke: #245b88; stroke-width: 1.8; marker-end: url(#blue-arrow); }
    .rule { fill: none; stroke: #d6dce1; stroke-width: 1; }
    .lifeline { fill: none; stroke: #a4adb5; stroke-width: 1; stroke-dasharray: 5 5; }
  </style>
  <rect width="1120" height="764" fill="#fff"/>
  <text x="44" y="42" class="title" text-anchor="start">Scheduling diagnostics</text>
  <text x="44" y="70" class="label" text-anchor="start">Prepared during scheduling; published through the existing session-close path.</text>
  <rect x="44" y="113" width="296" height="100" fill="#fff" stroke="#74818c" stroke-width="1.2"/>
  <text x="64" y="143" class="strong" text-anchor="start">Scheduling actions</text>
  <text x="64" y="171" class="" text-anchor="start">Resolve Pod failure / gang waiting</text>
  <text x="64" y="195" class="label" text-anchor="start">Keep candidate results local</text>
  <path d="M340 161 H430" class="edge"/>
  <text x="384" y="149" class="label" text-anchor="middle">prepare</text>
  <rect x="430" y="103" width="646" height="158" fill="#fff" stroke="#245b88" stroke-width="1.2"/>
  <rect x="430" y="103" width="646" height="42" fill="#eef4f8" stroke="#245b88" stroke-width="1.2"/>
  <text x="450" y="130" class="code strong" text-anchor="start">JobInfo</text>
  <text x="1056" y="130" class="label" text-anchor="end">session-owned</text>
  <text x="450" y="177" class="code blue" text-anchor="start">TaskSchedulingConditions</text>
  <text x="752" y="177" class="code" text-anchor="start">map[TaskID]v1.PodCondition</text>
  <text x="450" y="211" class="code" text-anchor="start">JobFitErrors</text>
  <text x="752" y="211" class="" text-anchor="start">group failure summary</text>
  <text x="450" y="242" class="label" text-anchor="start">No map entry → preserve the current PodScheduled condition.</text>
  <path d="M192 213 V253" class="edge" stroke-dasharray="4 4"/>
  <text x="192" y="277" class="strong" text-anchor="middle">Debug logs</text>
  <text x="192" y="299" class="label" text-anchor="middle">Trial nodes, domains and rollback</text>
  <path d="M753 261 V315 H192 V354" class="edge"/>
  <text x="747" y="302" class="code" text-anchor="end">CloseSession</text>
  <rect x="44" y="354" width="296" height="84" fill="#fff" stroke="#74818c" stroke-width="1.2"/>
  <text x="64" y="382" class="code" text-anchor="start">gang.OnSessionClose()</text>
  <text x="64" y="408" class="" text-anchor="start">Prepare PodGroup condition</text>
  <text x="64" y="428" class="label" text-anchor="start">Group state + JobFitErrors</text>
  <path d="M340 394 H430" class="edge"/>
  <rect x="430" y="354" width="260" height="84" fill="#fff" stroke="#74818c" stroke-width="1.2"/>
  <text x="450" y="383" class="code" text-anchor="start">JobUpdater</text>
  <text x="450" y="410" class="" text-anchor="start">Compare PodGroup status</text>
  <path d="M690 394 H780" class="edge"/>
  <rect x="780" y="340" width="296" height="126" fill="#fff" stroke="#74818c" stroke-width="1.2"/>
  <text x="800" y="368" class="code" text-anchor="start">cache.UpdateJobStatus()</text>
  <path d="M780 383 H1076" class="rule"/>
  <text x="800" y="407" class="label" text-anchor="start">Write PodGroup status if changed</text>
  <text x="800" y="440" class="code" text-anchor="start">RecordJobStatusEvent()</text>
  <path d="M820 466 V488 H580 V518" class="edge"/>
  <path d="M960 466 V518" class="edge"/>
  <rect x="835" y="518" width="241" height="58" fill="#fff" stroke="#74818c" stroke-width="1.2"/>
  <text x="955" y="552" class="strong" text-anchor="middle">PodGroup Event</text>
  <text x="835" y="602" class="label" text-anchor="start">Existing delivery policy;</text>
  <text x="835" y="622" class="label" text-anchor="start">deduplication belongs to #6108.</text>
  <text x="44" y="544" class="strong" text-anchor="start">Pod publication inputs</text>
  <text x="44" y="572" class="label" text-anchor="start">Optional prepared condition</text>
  <text x="44" y="594" class="label" text-anchor="start">Live nomination, checked independently</text>
  <path d="M351 572 H430" class="edge" stroke-dasharray="4 4"/>
  <rect x="430" y="518" width="342" height="96" fill="#f5f8fb" stroke="#245b88" stroke-width="1.2"/>
  <text x="450" y="547" class="code blue" text-anchor="start">updateTaskSchedulingStatus()</text>
  <text x="450" y="576" class="" text-anchor="start">Condition OR nomination changed?</text>
  <text x="450" y="600" class="label" text-anchor="start">Compare against the current Pod status</text>
  <path d="M500 614 V651 H370 V680" class="edge"/>
  <path d="M695 614 V680" class="edge"/>
  <text x="484" y="640" class="label" text-anchor="end">no</text>
  <text x="711" y="650" class="label" text-anchor="start">yes</text>
  <text x="370" y="706" class="strong" text-anchor="middle">Skip Pod Event / status write</text>
  <rect x="563" y="680" width="264" height="48" fill="#fff" stroke="#245b88" stroke-width="1.2"/>
  <text x="695" y="710" class="strong blue" text-anchor="middle">Pod Event + UpdateStatus</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="574pt" height="604pt" viewBox="0.00 0.00 574.30 603.80" role="img" aria-labelledby="title desc">
<title id="title">Scheduling diagnostics and publication</title><desc id="desc">Actions prepare native Pod conditions and a group summary in session JobInfo. At session close, gang prepares the group condition, JobUpdater compares group status, and the cache updates PodGroup status when required before RecordJobStatusEvent. The Pod helper compares its optional condition and live nomination independently. Unchanged inputs skip the Pod Event and status write. PodGroup Event deduplication remains separate.</desc><g id="graph0" class="graph" transform="scale(1 1) rotate(0) translate(14.4 589.4)">

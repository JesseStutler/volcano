<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 980" width="980" height="980">
  <style>
    text { font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif; }
    .title { font-size: 23px; font-weight: 700; fill: #111827; }
    .subtitle { font-size: 12px; fill: #6b7280; }
    .section { font-size: 13px; font-weight: 700; fill: #374151; }
    .node-title { font-size: 14px; font-weight: 700; fill: #111827; }
    .node-sub { font-size: 11px; fill: #4b5563; }
    .queue-title { font-size: 15px; font-weight: 700; fill: #1e3a8a; }
    .label { font-size: 11px; font-weight: 700; fill: #374151; }
    .tiny { font-size: 10px; fill: #6b7280; }
  </style>
  <defs>
    <marker id="green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#16a34a"/></marker>
    <marker id="orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#ea580c"/></marker>
    <marker id="blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#2563eb"/></marker>
    <marker id="purple" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#9333ea"/></marker>
    <marker id="gray" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><polygon points="0 0,10 4,0 8" fill="#64748b"/></marker>
  </defs>

  <rect width="980" height="980" fill="#ffffff"/>
  <text x="490" y="34" text-anchor="middle" class="title">kube-scheduler QueueingHint Data Flow</text>
  <text x="490" y="56" text-anchor="middle" class="subtitle">Pod-level queues store failed plugins; events ask those plugins whether to requeue a Pod.</text>

  <rect x="48" y="82" width="884" height="142" rx="10" fill="#faf5ff" stroke="#e9d5ff"/>
  <text x="68" y="107" class="section">1. Plugin registration path</text>
  <rect x="92" y="130" width="170" height="58" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="177" y="154" text-anchor="middle" class="node-title">Filter plugin</text>
  <text x="177" y="172" text-anchor="middle" class="node-sub">EnqueueExtensions</text>
  <rect x="405" y="130" width="170" height="58" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="490" y="154" text-anchor="middle" class="node-title">EventsToRegister</text>
  <text x="490" y="172" text-anchor="middle" class="node-sub">ClusterEventWithHint</text>
  <rect x="718" y="130" width="170" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="803" y="154" text-anchor="middle" class="node-title">SchedulingQueue</text>
  <text x="803" y="172" text-anchor="middle" class="node-sub">extra event handlers</text>
  <path d="M262 159 H405" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#purple)"/>
  <text x="334" y="147" text-anchor="middle" class="label">expose hints</text>
  <path d="M575 159 H718" stroke="#9333ea" stroke-width="2" fill="none" marker-end="url(#purple)"/>
  <text x="647" y="147" text-anchor="middle" class="label">register handlers</text>

  <rect x="48" y="252" width="884" height="218" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="68" y="277" class="section">2. Scheduling failure path</text>
  <rect x="82" y="314" width="130" height="58" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="147" y="338" text-anchor="middle" class="queue-title">activeQ</text>
  <text x="147" y="356" text-anchor="middle" class="node-sub">ready Pod</text>
  <rect x="82" y="396" width="130" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
  <text x="147" y="424" text-anchor="middle" class="queue-title">backoffQ</text>
  <rect x="310" y="318" width="160" height="68" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="390" y="346" text-anchor="middle" class="node-title">Schedule Pod</text>
  <text x="390" y="366" text-anchor="middle" class="node-sub">pop and run filters</text>
  <rect x="560" y="302" width="160" height="98" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
  <text x="640" y="332" text-anchor="middle" class="node-title">Filter failure</text>
  <text x="640" y="354" text-anchor="middle" class="node-sub">failed plugin names</text>
  <text x="640" y="372" text-anchor="middle" class="node-sub">stored in PodInfo</text>
  <rect x="780" y="302" width="130" height="98" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="845" y="332" text-anchor="middle" class="queue-title">unschedulablePods</text>
  <text x="845" y="354" text-anchor="middle" class="node-sub">PodInfo</text>
  <text x="845" y="372" text-anchor="middle" class="node-sub">plugins + timestamp</text>
  <path d="M212 343 H310" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#green)"/>
  <text x="261" y="331" text-anchor="middle" class="label">pop</text>
  <path d="M470 352 H560" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="515" y="340" text-anchor="middle" class="label">reject</text>
  <path d="M720 352 H780" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#orange)"/>
  <text x="750" y="340" text-anchor="middle" class="label">store</text>
  <path d="M390 386 C340 424 270 424 212 418" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#gray)"/>
  <text x="302" y="436" text-anchor="middle" class="label">if backoff applies</text>

  <rect x="48" y="500" width="884" height="226" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="68" y="525" class="section">3. Event wake-up path</text>
  <rect x="82" y="574" width="130" height="62" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="147" y="600" text-anchor="middle" class="node-title">Cluster event</text>
  <text x="147" y="618" text-anchor="middle" class="node-sub">from informer</text>
  <rect x="270" y="566" width="190" height="78" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <text x="365" y="592" text-anchor="middle" class="node-title">Move Pod Queue</text>
  <text x="365" y="612" text-anchor="middle" class="node-sub">MoveAllToActiveOrBackoffQueue</text>
  <rect x="535" y="566" width="160" height="78" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5"/>
  <text x="615" y="594" text-anchor="middle" class="node-title">QueueingHintFn</text>
  <text x="615" y="614" text-anchor="middle" class="node-sub">Pod + event</text>
  <rect x="770" y="556" width="130" height="48" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="835" y="580" text-anchor="middle" class="node-title">Queue result</text>
  <text x="835" y="596" text-anchor="middle" class="node-sub">activeQ / backoffQ</text>
  <rect x="770" y="638" width="130" height="48" rx="8" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.5"/>
  <text x="835" y="668" text-anchor="middle" class="node-title">Skip</text>
  <text x="770" y="524" text-anchor="middle" class="label">uses PodInfo from unschedulablePods</text>
  <path d="M212 605 H270" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="241" y="586" text-anchor="middle" class="label">event</text>
  <path d="M460 605 H535" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="498" y="593" text-anchor="middle" class="label">run hint</text>
  <path d="M695 590 H770" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#blue)"/>
  <text x="733" y="578" text-anchor="middle" class="label">Queue</text>
  <path d="M695 622 H770 V662" stroke="#64748b" stroke-width="1.7" stroke-dasharray="6,5" fill="none" marker-end="url(#gray)"/>
  <text x="735" y="650" class="label">Skip</text>
  <rect x="735" y="698" width="160" height="24" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="815" y="714" text-anchor="middle" class="tiny">timestamp watchdog also retries old PodInfo</text>

  <rect x="48" y="756" width="884" height="104" rx="10" fill="#f8fafc" stroke="#d1d5db"/>
  <text x="68" y="781" class="section">What differs from Volcano</text>
  <text x="92" y="812" class="node-sub">kube-scheduler caches and wakes individual Pods in queue buckets.</text>
  <text x="92" y="834" class="node-sub">Volcano keeps Jobs in session state and only skips selected expensive retry work.</text>

  <rect x="112" y="916" width="756" height="34" rx="7" fill="#ffffff" stroke="#d1d5db"/>
  <circle cx="136" cy="933" r="5" fill="#9333ea"/><text x="150" y="937" class="tiny">registration</text>
  <circle cx="258" cy="933" r="5" fill="#ea580c"/><text x="272" y="937" class="tiny">failure storage</text>
  <circle cx="405" cy="933" r="5" fill="#2563eb"/><text x="419" y="937" class="tiny">event wake-up</text>
  <circle cx="538" cy="933" r="5" fill="#64748b"/><text x="552" y="937" class="tiny">skip/watchdog</text>
  <text x="705" y="937" class="tiny">QueueingHintFn returns Queue or Skip per Pod.</text>
</svg>

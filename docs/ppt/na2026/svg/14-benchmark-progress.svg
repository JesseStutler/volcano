<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>14-benchmark-progress</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><rect x="0" y="0" width="710" height="490" rx="8" fill="#f5f8fc" stroke="#d4deea" stroke-width="1.6"/><rect x="770" y="0" width="710" height="490" rx="8" fill="#f5f8fc" stroke="#d4deea" stroke-width="1.6"/><text x="22" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#647282" text-anchor="start"><tspan x="22" dy="0">FRAMEWORK IN PLACE</tspan></text><text x="792" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#647282" text-anchor="start"><tspan x="792" dy="0">ONGOING VALIDATION</tspan></text><text x="28" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">Workload profiles</tspan></text><text x="28" y="163" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Gang jobs, bare Pods, and topology configurations</tspan></text><text x="28" y="249" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">Observability</tspan></text><text x="28" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Audit-based latency, scheduler metrics, and dashboards</tspan></text><text x="28" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">Automation</tspan></text><text x="28" y="429" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Setup scripts, test execution, and report collection</tspan></text><text x="798" y="116" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="798" dy="0">Workload scale and shape</tspan></text><text x="798" y="163" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="798" dy="0">Vary job size, Pod count, and placement constraints</tspan></text><text x="798" y="249" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="798" dy="0">Optimization comparisons</tspan></text><text x="798" y="296" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="798" dy="0">Keep configuration and measurement windows</tspan><tspan x="798" dy="33.28">comparable</tspan></text><text x="798" y="382" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="798" dy="0">Repeatability</tspan></text><text x="798" y="429" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="798" dy="0">Re-run observations and check where bottlenecks move</tspan></text><text x="0" y="545" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">Testing and optimization continue across workload scenarios.</tspan></text></svg>
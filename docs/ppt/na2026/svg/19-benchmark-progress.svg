<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>19-benchmark-progress</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><path d="M18,45 L762,45" fill="none" stroke="#d4deea" stroke-width="2.2" stroke-linejoin="round"/><rect x="0" y="0" width="780" height="338" rx="3" fill="#f5f7fa" stroke="#d6dfe9" stroke-width="1.6"/><text x="20" y="31" font-family="Liberation Sans, Arial, sans-serif" font-size="20" font-weight="700" fill="#647282" text-anchor="start"><tspan x="20" dy="0">benchmark/ · example workflow</tspan></text><text x="20" y="75.0" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282"># Build from local source</text><text x="20" y="107.13" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282">make setup</text><text x="20" y="139.26" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282"></text><text x="20" y="171.39" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282"># A gang workload scenario</text><rect x="4" y="178.51999999999998" width="772" height="32.129999999999995" rx="0" fill="#e4edf8" stroke="none" stroke-width="1.6"/><text x="20" y="203.51999999999998" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282">make test-gang-env \</text><text x="20" y="235.64999999999998" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282">  JOBS=10 REPLICAS=100 \</text><text x="20" y="267.78" xml:space="preserve" font-family="Liberation Mono" font-size="27" font-weight="400" fill="#647282">  MIN_AVAILABLE=100</text><text x="0" y="405" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="700" fill="#3d705d" text-anchor="start"><tspan x="0" dy="0">AVAILABLE</tspan></text><text x="0" y="453" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#202d3c" text-anchor="start"><tspan x="0" dy="0">Kind / existing clusters · Gang / Pod profiles</tspan><tspan x="0" dy="34.56">Topology setup · Audit / metrics · Reports</tspan></text><text x="850" y="56" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356696" text-anchor="start"><tspan x="850" dy="0">01</tspan></text><text x="895" y="56" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="895" dy="0">Vary the workload</tspan></text><text x="895" y="99" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#647282" text-anchor="start"><tspan x="895" dy="0">Job size, total Pods, and placement constraints.</tspan></text><text x="850" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356696" text-anchor="start"><tspan x="850" dy="0">02</tspan></text><text x="895" y="230" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="895" dy="0">Compare consistently</tspan></text><text x="895" y="273" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#647282" text-anchor="start"><tspan x="895" dy="0">Pin versions, resources, and measurement</tspan><tspan x="895" dy="32.0">windows.</tspan></text><text x="850" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356696" text-anchor="start"><tspan x="850" dy="0">03</tspan></text><text x="895" y="404" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="895" dy="0">Repeat and investigate</tspan></text><text x="89
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>07-hypernode-hierarchy</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><rect x="0" y="0" width="440" height="490" rx="8" fill="#ffffff" stroke="#d4deea" stroke-width="1.6"/><path d="M1000.0,95 L1000.0,150.0 L710.0,150.0 L710.0,201" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710.0,275 L710.0,340.0 L620.0,340.0 L620.0,401" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M710.0,275 L710.0,340.0 L800.0,340.0 L800.0,401" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1000.0,95 L1000.0,150.0 L1260.0,150.0 L1260.0,201" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1260.0,275 L1260.0,340.0 L1170.0,340.0 L1170.0,401" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1260.0,275 L1260.0,340.0 L1350.0,340.0 L1350.0,401" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="28" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">A hierarchy of domains</tspan></text><text x="28" y="135" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">HyperNode models network</tspan><tspan x="28" dy="35.84">topology across nodes.</tspan></text><text x="28" y="272" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#356696" text-anchor="start"><tspan x="28" dy="0">Hard constraint</tspan></text><text x="28" y="315" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Require a valid topology domain.</tspan></text><text x="28" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="700" fill="#356696" text-anchor="start"><tspan x="28" dy="0">Soft constraint</tspan></text><text x="28" y="443" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Prefer locality when feasible.</tspan></text><rect x="830" y="20" width="340" height="75" rx="8" fill="#e9f1fb" stroke="#8ea8cb" stroke-width="1.6"/><text x="1000.0" y="67.73" font-family="Liberation Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#202d3c" text-anchor="middle"><tspan x="1000.0" dy="0">Supernode</tspan></text><rect x="560" y="205" width="300" height="70" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="710.0" y="249.24" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="710.0" dy="0">Rack A</tspan></text><rect x="545" y="405" width="150" height="65" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="620.0" y="445.75" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="620.0" dy="0">Node 1</tspan></text><rect x="725" y="405" width="150" height="65" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="800.0" y="445.75" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="800.0" dy="0">Node 2</tspan></text><rect x="1110" y="205" width="300" height="70" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="1260.0" y="249.24" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="1260.0" dy="0">Rack B</tspan></text><rect x="1095" y="405" width="150" height="65" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="1170.0" y="445.75" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="1170.0" dy="0">Node 1</tspan></text><rect x="1275" y="405" width="150" height="65" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="1350.0" y="445.75" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="1350.0" dy="0">Node 2</tspan></text><text x="525" y="540" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#356696" text-anchor="start"><tspan x="525" dy="0">A topology domain describes locality, not scheduler ownership.</tspan></text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>16-takeaways</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><text x="0" y="42" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">01</tspan></text><text x="105" y="42" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="105" dy="0">Unified scheduling</tspan></text><text x="105" y="95" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#647282" text-anchor="start"><tspan x="105" dy="0">Different paths coordinate access to shared infrastructure.</tspan></text><text x="0" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">02</tspan></text><text x="105" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="105" dy="0">Workload-aware placement</tspan></text><text x="105" y="227" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#647282" text-anchor="start"><tspan x="105" dy="0">Complete groups, network locality, and instance separation.</tspan></text><text x="0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">03</tspan></text><text x="105" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="105" dy="0">Ecosystem integration</tspan></text><text x="105" y="359" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#647282" text-anchor="start"><tspan x="105" dy="0">Controllers bring role and replica identity into scheduling.</tspan></text><text x="0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">04</tspan></text><text x="105" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="33" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="105" dy="0">Benchmark and improve</tspan></text><text x="105" y="491" font-family="Liberation Sans, Arial, sans-serif" font-size="28" font-weight="400" fill="#647282" text-anchor="start"><tspan x="105" dy="0">Repeatable measurements guide ongoing validation.</tspan></text></svg>
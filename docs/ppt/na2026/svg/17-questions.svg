<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>17-questions</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><text x="0" y="65" font-family="Liberation Sans, Arial, sans-serif" font-size="37" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="0" dy="0">What does your workload need to keep together—or place apart?</tspan></text><text x="0" y="215" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="400" fill="#647282" text-anchor="start"><tspan x="0" dy="0">Bring us your workload shapes, topology constraints,</tspan><tspan x="0" dy="40.96">and reproducible scheduling observations.</tspan></text><text x="0" y="400" font-family="Liberation Sans, Arial, sans-serif" font-size="35" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">github.com/volcano-sh/volcano</tspan></text><text x="0" y="470" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#647282" text-anchor="start"><tspan x="0" dy="0">Roadmap and feedback: issue #6166</tspan></text></svg>
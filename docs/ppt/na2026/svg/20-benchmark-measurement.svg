<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>20-benchmark-measurement</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><path d="M355,132.5 L561,132.5" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M920,132.5 L1121,132.5" fill="none" stroke="#8ea8cb" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="7 5"/><path d="M0,250 L1480,250" fill="none" stroke="#d4deea" stroke-width="2.2" stroke-linejoin="round"/><rect x="0" y="90" width="355" height="85" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="177.5" y="142.4" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="middle"><tspan x="177.5" dy="0">Pod created</tspan></text><rect x="565" y="90" width="355" height="85" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="742.5" y="142.4" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="middle"><tspan x="742.5" dy="0">Pod scheduled</tspan></text><rect x="1125" y="90" width="355" height="85" rx="8" fill="#f5f8fc" stroke="#8ea8cb" stroke-width="1.6"/><text x="1302.5" y="141.41" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#202d3c" text-anchor="middle"><tspan x="1302.5" dy="0">Application ready</tspan></text><text x="380" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#356696" text-anchor="start"><tspan x="380" dy="0">scheduling latency</tspan></text><text x="955" y="68" font-family="Liberation Sans, Arial, sans-serif" font-size="21" font-weight="400" fill="#647282" text-anchor="start"><tspan x="955" dy="0">runtime / application</tspan></text><text x="0" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="0" dy="0">Latency distribution</tspan></text><text x="0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="0" dy="0">P50 / P90 / P99</tspan><tspan x="0" dy="33.28">Include the workload and scale.</tspan></text><text x="520" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="520" dy="0">Scheduling throughput</tspan></text><text x="520" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="520" dy="0">State the observation window.</tspan><tspan x="520" dy="33.28">Keep the raw events.</tspan></text><text x="1040" y="320" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="1040" dy="0">Comparison context</tspan></text><text x="1040" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#647282" text-anchor="start"><tspan x="1040" dy="0">Version, configuration, resources</tspan><tspan x="1040" dy="33.28">and repeat runs.</tspan></text><text x="0" y="535" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">Current focus: repeatable comparisons and continued validation.</tspan></text></svg>
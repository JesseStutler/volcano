<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>21-takeaways</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><text x="0" y="42" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">01</tspan></text><text x="100" y="42" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="100" dy="0">Unified scheduling</tspan></text><text x="100" y="94" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#647282" text-anchor="start"><tspan x="100" dy="0">Coordinate node access across specialized scheduling paths.</tspan></text><text x="0" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">02</tspan></text><text x="100" y="174" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="100" dy="0">Workload-aware placement</tspan></text><text x="100" y="226" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#647282" text-anchor="start"><tspan x="100" dy="0">Preserve complete groups, locality, and instance separation.</tspan></text><text x="0" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">03</tspan></text><text x="100" y="306" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="100" dy="0">Ecosystem integration</tspan></text><text x="100" y="358" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#647282" text-anchor="start"><tspan x="100" dy="0">Bring controller roles and replica identity into scheduling.</tspan></text><text x="0" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#356696" text-anchor="start"><tspan x="0" dy="0">04</tspan></text><text x="100" y="438" font-family="Liberation Sans, Arial, sans-serif" font-size="32" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="100" dy="0">Benchmark and improve</tspan></text><text x="100" y="490" font-family="Liberation Sans, Arial, sans-serif" font-size="27" font-weight="400" fill="#647282" text-anchor="start"><tspan x="100" dy="0">Use repeatable measurements to guide ongoing validation.</tspan></text></svg>
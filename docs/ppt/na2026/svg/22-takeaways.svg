<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>22-takeaways</title><defs><marker id="arrow-146653" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#146653"/></marker><marker id="arrow-164f89" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#164f89"/></marker><marker id="arrow-17283b" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#17283b"/></marker><marker id="arrow-414f60" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#414f60"/></marker><marker id="arrow-52677f" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#52677f"/></marker><marker id="arrow-62448d" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#62448d"/></marker><marker id="arrow-8b621c" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#8b621c"/></marker><marker id="arrow-a6b5c6" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#a6b5c6"/></marker><marker id="arrow-c14421" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#c14421"/></marker><marker id="arrow-dce5ee" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dce5ee"/></marker><marker id="arrow-dce9f8" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#dce9f8"/></marker><marker id="arrow-deeee8" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#deeee8"/></marker><marker id="arrow-eae3f3" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#eae3f3"/></marker><marker id="arrow-f2f5f9" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#f2f5f9"/></marker><marker id="arrow-fff5e2" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#fff5e2"/></marker><marker id="arrow-ffffff" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L12 6 L0 12 Z" fill="#ffffff"/></marker></defs><path d="M0,56 L1480,56" fill="none" stroke="#52677f" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,203 L1480,203" fill="none" stroke="#a6b5c6" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,343 L1480,343" fill="none" stroke="#a6b5c6" stroke-width="2.5" stroke-linejoin="round"/><path d="M0,511 L1480,511" fill="none" stroke="#a6b5c6" stroke-width="2.5" stroke-linejoin="round"/><text x="0" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#414f60" text-anchor="start"><tspan x="0" dy="0">WORKSTREAM</tspan></text><text x="360" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#414f60" text-anchor="start"><tspan x="360" dy="0">NEXT STEP</tspan></text><text x="935" y="30" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#414f60" text-anchor="start"><tspan x="935" dy="0">WHAT TO VALIDATE</tspan></text><text x="0" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#17283b" text-anchor="start"><tspan x="0" dy="0">Group placement</tspan></text><text x="360" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#164f89" text-anchor="start"><tspan x="360" dy="0">SubGroup affinity / anti-affinity</tspan></text><text x="360" y="143" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#414f60" text-anchor="start"><tspan x="360" dy="0">Extend the existing gang and topology model.</tspan></text><text x="935" y="98" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#17283b" text-anchor="start"><tspan x="935" dy="0">Cooperating groups stay local; replicas use</tspan><tspan x="935" dy="33.28">separate domains.</tspan></text><text x="0" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#17283b" text-anchor="start"><tspan x="0" dy="0">Community integration</tspan></text><text x="360" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#164f89" text-anchor="start"><tspan x="360" dy="0">RBG · Kubeflow · LWS multi-group</tspan></text><text x="360" y="283" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#414f60" text-anchor="start"><tspan x="360" dy="0">Carry roles and replica identity into scheduling.</tspan></text><text x="935" y="238" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#17283b" text-anchor="start"><tspan x="935" dy="0">Controllers preserve complete groups and</tspan><tspan x="935" dy="33.28">map placement constraints.</tspan></text><text x="0" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="29" font-weight="700" fill="#17283b" text-anchor="start"><tspan x="0" dy="0">Benchmark validation</tspan></text><text x="360" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="700" fill="#164f89" text-anchor="start"><tspan x="360" dy="0">Compare schedulers across scenarios</tspan></text><text x="360" y="423" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#414f60" text-anchor="start"><tspan x="360" dy="0">Find best-fit cases; test topology-aware gangs.</tspan></text><text x="935" y="378" font-family="Liberation Sans, Arial, sans-serif" font-size="26" font-weight="400" fill="#17283b" text-anchor="start"><tspan x="935" dy="0">Retain latency distributions, binding</tspan><tspan x="935" dy="33.28">throughput, and raw events.</tspan></text><text x="0" y="549" font-family="Liberation Sans, Arial, sans-serif" font-size="25" font-weight="700" fill="#17283b" text-anchor="start"><tspan x="0" dy="0">Bring a controller mapping, a placement requirement, or a reproducible workload to the community.</tspan></text></svg>
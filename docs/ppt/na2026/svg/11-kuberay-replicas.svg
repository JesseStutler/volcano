<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="560" viewBox="0 0 1480 560"><title>11-kuberay-replicas</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8ea8cb"/></marker></defs><rect x="0" y="0" width="440" height="490" rx="8" fill="#ffffff" stroke="#d4deea" stroke-width="1.6"/><rect x="500" y="0" width="980" height="350" rx="8" fill="#f5f8fc" stroke="#d4deea" stroke-width="1.6"/><rect x="530" y="145" width="440" height="132" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><rect x="1010" y="145" width="440" height="132" rx="8" fill="#ffffff" stroke="#8ea8cb" stroke-width="1.6"/><text x="28" y="55" font-family="Liberation Sans, Arial, sans-serif" font-size="31" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">One worker group</tspan></text><text x="28" y="145" font-family="Liberation Mono, Arial, sans-serif" font-size="28" font-weight="700" fill="#356696" text-anchor="start"><tspan x="28" dy="0">minReplicas: 2</tspan><tspan x="28" dy="35.84">numOfHosts: 2</tspan></text><text x="28" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="30" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="28" dy="0">Two complete replicas,</tspan><tspan x="28" dy="38.4">each spanning two Pods.</tspan></text><text x="28" y="426" font-family="Liberation Sans, Arial, sans-serif" font-size="24" font-weight="400" fill="#647282" text-anchor="start"><tspan x="28" dy="0">Head group omitted here.</tspan></text><text x="522" y="36" font-family="Liberation Sans, Arial, sans-serif" font-size="23" font-weight="700" fill="#647282" text-anchor="start"><tspan x="522" dy="0">SUBGROUP POLICY PRESERVES LOGICAL REPLICA IDENTITY</tspan></text><text x="546" y="175" font-family="Liberation Sans, Arial, sans-serif" font-size="22" font-weight="700" fill="#202d3c" text-anchor="start"><tspan x="546" dy="
name: Bug report
description: Report a bug you have reproduced on a real Kubernetes cluster
labels: kind/bug
body:
  - type: markdown
    attributes:
      value: |
        Reproduce the bug on a real Kubernetes cluster with Volcano deployed before
        submitting. Local kind or minikube clusters count; mocks and direct calls to
        internal functions do not. Unit tests, static analysis, AI output, and code
        path reasoning cannot replace cluster reproduction.

        Reports without cluster reproduction steps and actual evidence will be
        closed. Root-cause analysis and a suggested fix are optional.
        See the [bug-reporting requirements](https://github.com/volcano-sh/volcano/blob/master/CONTRIBUTING.md#file-an-issue).

        Search existing issues first and report one bug per issue. For help, use the
        Question template or our [Slack channel](https://cloud-native.slack.com/messages/volcano).

  - type: checkboxes
    attributes:
      label: Cluster reproduction
      options:
        - label: I have reproduced this failure on a real Kubernetes cluster with Volcano deployed and included the steps and actual output below.
          required: true

  - type: textarea
    attributes:
      label: Actual and expected behavior
      description: |
        Describe your user scenario, what happened, and what you expected.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Environment
      description: Include the exact versions and configuration used for this reproduction.
      placeholder: |
        Volcano image tag or commit:
        Kubernetes version:
        Cluster setup (e.g. kind, node count and resources):
        Relevant Volcano configuration (e.g. scheduler actions/plugins, feature gates):
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce on a real cluster
      description: |
        Include minimal workload YAML and exact commands another person can run on
        the setup above. Use normal workloads or supported user operations.
        For intermittent failures, state the frequency and test duration or attempt count.
      placeholder: |
        1. Apply the following manifests: ...
        2. Run: ...
        3. Observe the failure: ...
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual output from the cluster reproduction
      description: |
        Paste relevant logs, events, resource status, or a stack trace from the run
        above. For performance problems, include cluster measurements or profiles,
        the workload scale, and the measurement procedure. Unit-test or standalone
        benchmark output alone is not sufficient.
      placeholder: |
        Command or collection method: ...
        Actual output: ...
    validations:
      required: true

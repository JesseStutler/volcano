name: Bug report
description: Create a bug report to help improve volcano
labels: kind/bug
body:
  - type: markdown
    attributes:
      value: |
        If you are reporting a new issue, make sure that we do not have any duplicates
        already open. You can ensure this by searching the issue list for this
        repository. If there is a duplicate, please close your issue and add a comment
        to the existing issue instead.

        Before submitting, reproduce the bug on a real Kubernetes cluster with
        Volcano deployed. Local kind or minikube clusters count. Reports without
        cluster reproduction steps and actual evidence will be closed. Unit tests,
        mocks, static analysis, and AI output cannot replace cluster reproduction.
        See "Evidence and production path" below. A suggested fix is optional.

        If you're looking for help then check our [Slack Channel](https://cloud-native.slack.com/messages/volcano) or have a look at our [dev mailing](https://groups.google.com/forum/#!forum/volcano-sh)

  - type: textarea
    attributes:
      label: Description
      description: |
        Describe the user scenario, behavior observed in your cluster, and impact.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce the issue
      description: |
        Provide minimal workload manifests, relevant Volcano configuration, and exact
        commands to reproduce on a real cluster through normal user operations.
        For intermittent failures, include the frequency and test duration or attempt count.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Evidence and production path
      description: |
        Include actual evidence from the cluster run described above:
        1. Relevant logs, events, or resource status showing the failure.
        2. For a race, panic, or deadlock, include the available race report, panic
           stack, or diagnostic output from that run.
        3. For a performance problem, include cluster measurements or profiles,
           the workload scale, and the measurement procedure.
        4. For validation or hardening, explain why the input is valid or expected in
           normal use and show the failure it causes in the cluster.

        Source analysis is optional. If included, use exact-commit permalinks and
        explain the path from a user action or cluster event to the failure.
        Code path reasoning, unit tests, and standalone benchmarks do not replace
        cluster reproduction.
      placeholder: |
        Add the actual cluster output and how it was collected; code links are optional.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the results you received and expected
    validations:
      required: true

  - type: input
    attributes:
      label: What version of Volcano are you using?
      placeholder: Exact Volcano image tag or commit
    validations:
      required: true

  - type: textarea
    attributes:
      label: Any other relevant information
      description: |
        Include the Kubernetes version and cluster setup (e.g. kind, node count
        and resources). Add OS configuration and OS/Kernel version if relevant.
        Use the following commands:
        $ kubectl version
        $ cat /etc/os-release
        $ uname -a
    validations:
      required: true

name: Bug report
description: Create a bug report to help improve volcano
labels: kind/bug
body:
  - type: markdown
    attributes:
      value: |
        If you are reporting a new issue, make sure that we do not have any duplicates
        already open. You can ensure this by searching the issue list for this
        repository. If there is a duplicate, please close your issue and add a comment
        to the existing issue instead.

        Before submitting, reproduce the bug on a real Kubernetes cluster with
        Volcano deployed. Local kind or minikube clusters count. Reports without
        cluster reproduction steps and actual evidence will be closed. Unit tests,
        mocks, static analysis, and AI output cannot replace cluster reproduction.
        See "Evidence" below. A suggested fix is optional.

        If you're looking for help then check our [Slack Channel](https://cloud-native.slack.com/messages/volcano) or have a look at our [dev mailing](https://groups.google.com/forum/#!forum/volcano-sh)

  - type: textarea
    attributes:
      label: Description
      description: |
        Describe the user scenario, behavior observed in your cluster, and impact.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce the issue
      description: |
        Provide minimal workload manifests, relevant Volcano configuration, and exact
        commands to reproduce on a real cluster through normal user operations.
        For intermittent failures, include the frequency and test duration or attempt count.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Evidence
      description: |
        Provide actual output from the cluster reproduction. Choose the evidence
        relevant to your issue; you do not need to provide every type below:
        1. Component logs, Kubernetes events, or resource status showing the failure.
        2. A panic stack, race report, or diagnostic trace for a crash, race, or hang.
        3. Cluster measurements or profiles for a performance problem, including the
           workload scale and how the measurements were collected.
        4. Rejected input and the resulting error for a validation problem, explaining
           why that input should be accepted.

        If you have already identified a likely root cause, you may also explain it
        and link to the relevant code using exact-commit permalinks. Explain how that
        code causes the observed failure. This source analysis is optional and
        supplements the cluster evidence; it does not replace it. Unit tests and
        standalone benchmarks alone are not sufficient.
      placeholder: |
        Add the actual cluster output and how it was collected; code links are optional.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Describe the results you received and expected
    validations:
      required: true

  - type: input
    attributes:
      label: What version of Volcano are you using?
      description: |
        Specify a release version (vX.Y.Z) or master. A commit ID alone is not
        sufficient. You may include the tested commit or image digest as additional
        information, especially when using master.
      placeholder: vX.Y.Z or master
    validations:
      required: true

  - type: textarea
    attributes:
      label: Any other relevant information
      description: |
        Include the Kubernetes version and cluster setup (e.g. kind, node count
        and resources). Add OS configuration and OS/Kernel version if relevant.
        Use the following commands:
        $ kubectl version
        $ cat /etc/os-release
        $ uname -a
    validations:
      required: true
